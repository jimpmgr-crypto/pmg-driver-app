async function loadJobs(options = {}) {
  if (!options.force && document.hidden) return;
  const date = todayISO();
  $('jobs-container').innerHTML = `<div class="loading"><div class="spinner"></div>Loading jobs from Haultech…</div>`;
  showError(null);

  try {
    if (!customers.length) await loadCustomers();
    const resp = await api(`/ht/jobs?date=${date}`);
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      if (err.error === 'no_haultech_auth') {
        showError('Haultech auth token not set. Falling back to cached data.');
        return loadJobsFallback(date);
      }
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const now = new Date().toISOString();
    let jobs = Array.isArray(data) ? data : (data.items || data.data || []);
    jobs = jobs.map(j => ({ ...j, savedAt: j.savedAt || now }));
    jobs = mergeWithLocal(date, jobs);
    allJobs = jobs;
    lastJobsUpdatedAt = new Date();
    renderJobs();
    saveJobsToCloud(date, allJobs); // non-blocking backup
  } catch (e) {
    console.error('Load jobs error:', e);
    showError('Could not reach Haultech. Showing cached data.');
    return loadJobsFallback(date);
  }
}

async function loadJobsFallback(date) {
  try {
    const resp = await api(`/haultech-jobs/${date}`);
    const cached = resp.ok ? await resp.json() : [];
    let jobs = cached.map(j => ({
      jobId: j.id, _cached: true, _driver: j.driver, _customer: j.customer,
      _addedBy: j.addedBy || j.createdBy || j.driver || '',
      _material: j.material, _from: j.from, _to: j.to,
      _vehicle: j.vehicle,
      _quantity: j.quantity, _price: j.price, _status: j.status,
      _paymentStatus: j.paymentStatus || j.a1PaymentStatus || '',
      _a1PaymentStatus: j.a1PaymentStatus || j.paymentStatus || '',
      savedAt: j.savedAt,
    }));
    try {
      const savedResp = await api(`/jobs/${date}`);
      const savedPayload = savedResp.ok ? await savedResp.json() : [];
      const savedJobs = Array.isArray(savedPayload) ? savedPayload : (savedPayload.jobs || []);
      const existingKeys = new Set(jobs.map(j => String(j._reference || j.ticketNo || j.jobId || j.id || '')));
      for (const lj of driverReviewBackupJobs(savedJobs)) {
        const key = String(lj.reference || lj.ticketNo || lj.id || '');
        if (key && existingKeys.has(key)) continue;
        if (isLocalDriverTempJob(lj) && findMatchingLiveDriverJob(lj, jobs)) continue;
        jobs.push({
          jobId: lj.id, _cached: true, _driverAdded: true,
          _driver: lj.driver, _customer: lj.customer,
          _addedBy: lj.addedBy || lj.createdBy || lj.driver || '',
          _material: lj.material, _from: lj.from, _to: lj.to,
          _vehicle: lj.vehicle,
          _quantity: lj.quantity, _price: lj.price, _status: lj.status,
          _unit: lj.unit,
          _routeOrder: lj.routeOrder, _loadNumber: lj.loadNumber,
          _reference: lj.reference || lj.ticketNo || '',
          _notes: lj.notes || '',
          _paymentStatus: lj.paymentStatus || lj.a1PaymentStatus || '',
          _a1PaymentStatus: lj.a1PaymentStatus || lj.paymentStatus || '',
          _wtn: lj.wtn || lj.wasteTransferNote || null,
          _ewcCode: lj.ewcCode || '',
          _sicCode: lj.sicCode || '',
          _containment: lj.containment || '',
          savedAt: lj.savedAt,
        });
        if (key) existingKeys.add(key);
      }
    } catch {}
    jobs = mergeWithLocal(date, jobs);
    allJobs = jobs;
    renderJobs();
  } catch {
    // Last resort — pure localStorage
    const localJobs = localGetJobs(date);
    allJobs = localJobs.map(lj => ({
      jobId: lj.id, _cached: true, _driverAdded: true,
      _driver: lj.driver, _customer: lj.customer,
      _addedBy: lj.addedBy || lj.createdBy || lj.driver || '',
      _material: lj.material, _from: lj.from, _to: lj.to,
      _vehicle: lj.vehicle,
      _quantity: lj.quantity, _price: lj.price, _status: lj.status,
      _paymentStatus: lj.paymentStatus || lj.a1PaymentStatus || '',
      _a1PaymentStatus: lj.a1PaymentStatus || lj.paymentStatus || '',
      savedAt: lj.savedAt,
    }));
    renderJobs();
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// JOB DATA EXTRACTION
// ══════════════════════════════════════════════════════════════════════════════

function getJobDriver(job) {
  if (job._cached) return job._driver || getJobAddedBy(job) || '';
  const addedBy = getJobAddedBy(job);
  if (addedBy) return addedBy;
  const did = job.deliveryDriverId || job.collectionDriverId;
  if (did && DRIVER_IDS[did]) return DRIVER_IDS[did];
  const alloc = (job.allocations || [])[0];
  return alloc?.driverName || alloc?.driver || job.driverName || job.driver || '';
}

function getJobDriverId(job) {
  if (job._cached) return null;
  return job.deliveryDriverId || job.collectionDriverId || ((job.allocations || [])[0]?.driverId) || null;
}

function getJobVehicle(job) {
  if (job._cached) return job._vehicle || '';
  if (job._vehicle || job.vehicle) return job._vehicle || job.vehicle;
  const vid = job.deliveryVehicleId || job.collectionVehicleId;
  if (vid && VEHICLES[vid]) return VEHICLES[vid];
  const alloc = (job.allocations || [])[0];
  const allocVid = alloc?.vehicleId;
  if (allocVid && VEHICLES[allocVid]) return VEHICLES[allocVid];
  return alloc?.vehicleName || alloc?.vehicleRegistration || '';
}

function getJobConsignment(job) {
  if (job._cached) return null;
  return (job.consignments || [])[0] || null;
}

function isGuidId(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(value || ''));
}

function getJobConsignmentId(job) {
  const c = getJobConsignment(job);
  const id = [c?.id].find(isGuidId);
  return id || null;
}

function getHaultechJobId(job) {
  const c = getJobConsignment(job);
  // Haultech complete expects the job GUID, not the visible numeric
  // job/consignment number returned as jobId/consignmentId.
  const id = [job.id, job._id, job.jobId, c?.id].find(isGuidId);
  return id || null;
}

function getJobNumber(job) {
  return job.jobNumber || job.jobId || job.id?.substring(0, 6) || '—';
}

function getJobCustomer(job) {
  if (job._cached) return job._customer || 'Unknown';
  const cid = job.customerId;
  if (cid && customers.length) {
    const found = customers.find(c => c.id === cid);
    if (found) return found.name || found.code;
  }
  if (cid && CUSTOMER_MAP[cid]) return CUSTOMER_MAP[cid];
  return job.customerName || (cid ? cid.substring(0, 8) : 'Unknown');
}

function getJobMaterial(job) {
  if (job._cached) return job._material || '';
  const c = getJobConsignment(job);
  return c?.goodsDescription || '';
}

function jobRequiresConcreteSource(job) {
  const goods = String(getJobMaterial(job) || '').toLowerCase();
  if (/\b6f2\b|\bcrush(?:ed)?\b|\bhardcore\b|\bclean concrete\s*\/\s*brick\b|\bconcrete agg(?:regate)?\b/.test(goods)) return false;
  return /\b(?:c|rc)\s*\d{2}/.test(goods)
    || /\bst\s*\d+\b/.test(goods)
    || /\bconcrete\b/.test(goods);
}

function concreteSourceAlreadyShown(job) {
  const text = [
    getJobMaterial(job),
    getJobNotes(job),
    job?.accountNotes,
    job?.trafficNotes,
  ].filter(Boolean).join(' ').toLowerCase();
  if (/\bquarried\b|\bquarry\b|\bqu\b/.test(text)) return 'quarried';
  if (/\brecycled\b|\brec\b/.test(text)) return 'recycled';
  return '';
}

function getJobFrom(job) {
  if (job._cached) return job._from || '';
  const c = getJobConsignment(job);
  if (!c) return '';
  return c.collectionAddressLine1 || c.collectionPostcode || '';
}

function getJobTo(job) {
  if (job._cached) return job._to || '';
  const c = getJobConsignment(job);
  if (!c) return '';
  return c.deliveryAddressLine1 || c.deliveryPostcode || '';
}

function getJobWeight(job) {
  if (job._cached) return job._quantity || '';
  const c = getJobConsignment(job);
  return c?.weight || c?.quantity || '';
}

function numberOrInfinity(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : Number.POSITIVE_INFINITY;
}

function getJobRouteOrder(job) {
  if (job._cached) return numberOrInfinity(job._routeOrder);
  const c = getJobConsignment(job);
  return Math.min(
    numberOrInfinity(c?.deliveryDropNumber),
    numberOrInfinity(c?.collectionDropNumber)
  );
}

function getJobLoadNumber(job) {
  if (job._cached) return job._loadNumber || '';
  return job.deliveryLoadNumber || job.collectionLoadNumber || job.loadId || '';
}

function getJobSortTime(job) {
  const raw = job.deliveryStartTime || job.collectionStartTime || job.savedAt || '';
  const t = raw ? Date.parse(raw) : NaN;
  return Number.isFinite(t) ? t : Number.POSITIVE_INFINITY;
}

function getJobStableNumber(job) {
  const n = Number(job.jobId || job.jobNumber || '');
  return Number.isFinite(n) ? n : Number.POSITIVE_INFINITY;
}

function sortJobsForDriver(jobs) {
  return [...jobs].sort((a, b) => {
    const aAdded = !!(a._driverAdded || (a.id && String(a.id).startsWith('driver-')));
    const bAdded = !!(b._driverAdded || (b.id && String(b.id).startsWith('driver-')));
    if (aAdded !== bAdded) return aAdded ? 1 : -1;

    const aLoad = numberOrInfinity(getJobLoadNumber(a));
    const bLoad = numberOrInfinity(getJobLoadNumber(b));
    if (aLoad !== bLoad) return aLoad - bLoad;

    const aRoute = getJobRouteOrder(a);
    const bRoute = getJobRouteOrder(b);
    if (aRoute !== bRoute) return aRoute - bRoute;

    const aTime = getJobSortTime(a);
    const bTime = getJobSortTime(b);
    if (aTime !== bTime) return aTime - bTime;

    return getJobStableNumber(a) - getJobStableNumber(b);
  });
}

function getJobPrice(job) {
  if (job._cached) return job._price ?? '';
  return job.quotedPrice ?? '';
}

function hasDisplayPrice(price) {
  if (price === undefined || price === null || String(price).trim() === '') return false;
  return Number.isFinite(Number(price));
}

function normalisePaymentStatus(value) {
  const raw = String(value || '').trim().toLowerCase().replace(/\s+/g, '_');
  if (['paid', 'yes', 'true', '1'].includes(raw)) return 'paid';
  if (['not_paid', 'unpaid', 'no', 'false', '0'].includes(raw)) return 'not_paid';
  return '';
}

function getJobPaymentStatus(job) {
  const direct = normalisePaymentStatus(
    job?._paymentStatus || job?._a1PaymentStatus || job?.paymentStatus || job?.a1PaymentStatus
  );
  if (direct) return direct;
  const noteParts = [job?.trafficNotes, job?.trafficnotes, job?.notes, job?._notes]
    .filter(Boolean)
    .flatMap(value => String(value).split('|'))
    .map(value => value.trim());
  const exact = noteParts.find(value => /^(?:paid|not paid)$/i.test(value));
  if (exact) return /^paid$/i.test(exact) ? 'paid' : 'not_paid';
  const accountParts = [job?.accountNotes, job?.accountnotes]
    .filter(Boolean)
    .flatMap(value => String(value).split('|'))
    .map(value => value.trim());
  const account = accountParts.find(value => /^(?:A1|Customer)\s+payment\s*:/i.test(value));
  if (account) return /:\s*paid\s*$/i.test(account) ? 'paid' : 'not_paid';
  return 'not_paid';
}

function replacePaymentToken(value, paymentStatus) {
  const label = paymentStatus === 'paid' ? 'Paid' : 'Not paid';
  const parts = String(value || '')
    .split('|')
    .map(part => part.trim())
    .filter(Boolean)
    .filter(part => !/^(?:paid|not paid)$/i.test(part));
  return [label, ...parts].join(' | ');
}

function setJobPaymentStatus(job, paymentStatus) {
  const status = normalisePaymentStatus(paymentStatus) || 'not_paid';
  job.paymentStatus = status;
  job.a1PaymentStatus = status;
  job._paymentStatus = status;
  job._a1PaymentStatus = status;
  if (Object.prototype.hasOwnProperty.call(job, 'trafficNotes')) {
    job.trafficNotes = replacePaymentToken(job.trafficNotes, status);
  }
  if (Object.prototype.hasOwnProperty.call(job, 'trafficnotes')) {
    job.trafficnotes = replacePaymentToken(job.trafficnotes, status);
  }
  if (Object.prototype.hasOwnProperty.call(job, 'notes')) job.notes = replacePaymentToken(job.notes, status);
  if (Object.prototype.hasOwnProperty.call(job, '_notes')) job._notes = replacePaymentToken(job._notes, status);
}

function getJobStatus(job) {
  if (job._cached) return job._status || 'scheduled';
  const c = getJobConsignment(job);
  const driverStatus = String(c?.deliveryDriverStatus || c?.collectionDriverStatus || '').toLowerCase();
  if (c?.deliverySigned || c?.collectionSigned) return 'complete';
  if (['signed', 'completed', 'complete', 'delivered'].includes(driverStatus)) return 'complete';
  if (['departed', 'in progress', 'intransit', 'in transit', 'collected'].includes(driverStatus)) return 'departed';
  const liveStatus = mapStatus(job.deliveryStatus || job.collectionStatus || job.status);
  if (liveStatus !== 'scheduled') return liveStatus;
  if (['problem', 'needs-office-review', 'cancelled', 'not-done', 'carry-forward', 'started', 'departed', 'in-transit'].includes(job.status)) {
    return job.status;
  }
  return liveStatus;
}

function isDriverAddedJob(job) {
  return !!(job?._driverAdded || getJobAddedBy(job) || (job?.id && String(job.id).startsWith('driver-')) || (job?.jobId && String(job.jobId).startsWith('driver-')));
}

function canonicalDriverName(value) {
  const clean = normaliseNoteText(value);
  if (!clean) return '';
  const found = Object.values(INCAB_USERS).find(user => user.name.toLowerCase() === clean.toLowerCase());
  return found?.name || clean;
}

function sameDriverName(a, b) {
  return normaliseNoteText(a).toLowerCase() === normaliseNoteText(b).toLowerCase();
}

function extractAddedByDriver(text) {
  const raw = normaliseNoteText(text);
  if (!raw) return '';
  const lower = raw.toLowerCase();
  for (const user of Object.values(INCAB_USERS)) {
    const name = user.name.toLowerCase();
    if (lower.includes(`added by ${name}`) || lower.startsWith(`${name} /`) || lower.startsWith(`${name}:`)) {
      return user.name;
    }
  }
  const match = raw.match(/\badded\s+by\s+([^|:/]+(?:\s+[^|:/]+)*?)(?:\s*\/\s*[^|:]*)?(?:\s*(?:\||:|$))/i);
  return match ? canonicalDriverName(match[1]) : '';
}

function getJobAddedBy(job) {
  if (!job) return '';
  const flaggedDriverAdded = !!(job._driverAdded || (job.id && String(job.id).startsWith('driver-')) || (job.jobId && String(job.jobId).startsWith('driver-')));
  const direct = job._addedBy || job.addedBy || job.createdBy || job.sourceDriverName || (flaggedDriverAdded ? (job.driver || job.driverName || job._driver) : '');
  if (direct) return canonicalDriverName(direct);
  const noteText = [job.accountNotes, job.trafficNotes, job.specialInstructions, job.notes, job._notes].filter(Boolean).join(' | ');
  return extractAddedByDriver(noteText);
}

function rawHaultechJobLooksDone(job) {
  const c = getJobConsignment(job);
  const driverStatus = String(c?.deliveryDriverStatus || c?.collectionDriverStatus || '').toLowerCase();
  if (c?.deliverySigned || c?.collectionSigned) return true;
  if (['signed', 'completed', 'complete', 'delivered'].includes(driverStatus)) return true;
  return mapStatus(job.deliveryStatus || job.collectionStatus || job.status) === 'complete';
}

function sameHaultechJob(a, b, consId) {
  const aIds = [a?.id, a?._id, getJobConsignment(a)?.id, a?.jobId, a?.jobNumber].filter(Boolean).map(String);
  const bIds = [b?.id, b?._id, getJobConsignment(b)?.id, b?.jobId, b?.jobNumber].filter(Boolean).map(String);
  if (consId && aIds.includes(String(consId))) return true;
  return aIds.some(id => bIds.includes(id));
}

async function verifyHaultechCompletion(job, consId) {
  try {
    const resp = await api(`/ht/jobs?date=${todayISO()}&raw=true`);
    if (!resp.ok) throw new Error(await responseError(resp, 'Raw Haultech check failed'));
    const payload = await resp.json();
    const jobs = Array.isArray(payload) ? payload : (payload.items || payload.data || []);
    const liveJob = jobs.find(j => sameHaultechJob(j, job, consId));
    if (!liveJob) return { ok: false, reason: 'completed job not found in raw Haultech diary check' };
    if (rawHaultechJobLooksDone(liveJob)) return { ok: true, reason: 'raw Haultech diary shows received/completed' };
    return { ok: false, reason: 'raw Haultech diary still does not show received/completed' };
  } catch (e) {
    return { ok: false, reason: e.message || 'raw Haultech diary check failed' };
  }
}

function getJobNotes(job) {
  if (job._cached) return job._notes || '';
  return job.trafficNotes || job.specialInstructions || '';
}

function normaliseNoteText(value) {
  return String(value || '').replace(/\s+/g, ' ').trim();
}

function mergeDriverNoteText(existing, driverNote) {
  const note = normaliseNoteText(driverNote);
  const base = normaliseNoteText(existing);
  if (!note) return base;
  const baseLower = base.toLowerCase();
  if (baseLower.includes(note.toLowerCase())) return base;
  return base ? `${base} | ${note}` : note;
}

function applyDriverCompletionNote(job, driverNote) {
  const existingDriverNotes = job?._cached ? job._notes : (job?.trafficNotes || job?.trafficnotes || '');
  const merged = mergeDriverNoteText(existingDriverNotes, driverNote);
  if (!job) return merged;
  if (job._cached) job._notes = merged;
  else job.trafficNotes = merged;
  job.notes = merged;
  return merged;
}

function getJobRef(job) {
  if (job._cached) return job._reference || job.ticketNo || '';
  return job.customerReference || '';
}

function getDeliveryAddress(job) {
  if (job._cached) return { line1: job._to || '', line3: '', line4: '', postcode: '' };
  const c = getJobConsignment(job);
  if (!c) return { line1: '', line3: '', line4: '', postcode: '' };
  return {
    line1: c.deliveryAddressLine1 || '',
    line3: c.deliveryAddressLine3 || '',
    line4: c.deliveryAddressLine4 || '',
    postcode: c.deliveryPostcode || '',
  };
}

function getCollectionAddress(job) {
  if (job._cached) return { line1: job._from || '', line3: '', line4: '', postcode: '' };
  const c = getJobConsignment(job);
  if (!c) return { line1: '', line3: '', line4: '', postcode: '' };
  return {
    line1: c.collectionAddressLine1 || '',
    line3: c.collectionAddressLine3 || '',
    line4: c.collectionAddressLine4 || '',
    postcode: c.collectionPostcode || '',
  };
}

function getJobContact(job) {
  if (job._cached) return '';
  const c = getJobConsignment(job);
  return c?.deliveryContactNumber || c?.deliveryContactName || job.contactNumber || '';
}

function getJobSiteContact(job) {
  if (job._cached) return '';
  const c = getJobConsignment(job);
  return c?.deliveryContactName || '';
}

function getDeliveryWindow(job) {
  if (job._cached) return '';
  const start = job.deliveryStartTime || '';
  const end = job.deliveryEndTime || '';
  if (!start && !end) return '';
  const fmt = t => {
    if (!t) return '';
    if (t.includes('T')) {
      const d = new Date(t);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    return t;
  };
  return `${fmt(start)} – ${fmt(end)}`.trim();
}

function jobMapQuery(job, mode = 'delivery') {
  const addr = mode === 'collection' ? getCollectionAddress(job) : getDeliveryAddress(job);
  const parts = [addr.line1, addr.line3, addr.line4, addr.postcode].filter(Boolean);
  if (parts.length) return parts.join(', ');
  return mode === 'collection' ? getJobFrom(job) : getJobTo(job);
}

function mapUrlForQuery(query, provider = 'apple') {
  const encoded = encodeURIComponent(query);
  if (provider === 'google') return `https://www.google.com/maps/dir/?api=1&destination=${encoded}&travelmode=driving`;
  return `https://maps.apple.com/?daddr=${encoded}&dirflg=d`;
}

function mapChoiceLinks(query, mode = 'delivery') {
  if (!query) return '';
  return `
    <div class="map-panel-actions">
      <a class="btn btn-map map-link" href="${mapUrlForQuery(query, 'apple')}" target="_blank" rel="noopener" data-map-provider="apple" data-map-mode="${esc(mode)}">Apple Maps</a>
      <a class="btn btn-google-map map-link" href="${mapUrlForQuery(query, 'google')}" target="_blank" rel="noopener" data-map-provider="google" data-map-mode="${esc(mode)}">Google Maps</a>
    </div>`;
}

function trackMapRoute(job, mode, query, provider = 'apple') {
  queueTrialEvent('map_route', job, { mode, provider, address: query, state: 'written', haultechWriteState: 'written' });
}

function attachMapChoiceListeners(container, job, mode, query) {
  container.querySelectorAll('.map-link').forEach(link => {
    link.addEventListener('click', () => {
      trackMapRoute(job, link.dataset.mapMode || mode, query, link.dataset.mapProvider || 'apple');
    });
  });
}

function openJobMap(job, mode = 'delivery', provider = 'apple') {
  const query = jobMapQuery(job, mode);
  if (!query) { toast('No address for map'); return; }
  trackMapRoute(job, mode, query, provider);
  window.open(mapUrlForQuery(query, provider), '_blank', 'noopener');
}

function renderJobs() {
  const container = $('jobs-container');
  if (isManager) {
    renderManagerView(container);
  } else {
    renderDriverView(container);
  }
}

function getDriverJobs(driverId, driverName) {
  const lname = driverName.toLowerCase();
  return allJobs.filter(j => {
    if (j._cached) return (j._driver || getJobAddedBy(j) || '').toLowerCase() === lname;
    const addedBy = getJobAddedBy(j);
    if (addedBy && sameDriverName(addedBy, driverName)) return true;
    const jDriverId = getJobDriverId(j);
    if (jDriverId) return jDriverId === driverId;
    const jDriverName = getJobDriver(j);
    if (jDriverName && jDriverName.toLowerCase() === lname) return true;
    const tn = normaliseNoteText([j.trafficNotes, j.accountNotes, j.specialInstructions].filter(Boolean).join(' | ')).toLowerCase();
    return tn.startsWith(lname) || tn.includes(`added by ${lname}`);
  });
}

function getOpenDayReviewJobs(jobs) {
  const closed = new Set(['complete', 'cancelled', 'needs-office-review', 'problem', 'not-done', 'carry-forward']);
  return jobs.filter(job => !closed.has(getJobStatus(job)));
}

function renderDayReviewPanel(jobs) {
  const openJobs = getOpenDayReviewJobs(jobs);
  if (!dayReviewOpen) return '';
  if (!openJobs.length) {
    return `
      <div class="day-review">
        <div class="day-review-head">
          <div>
            <h3>Finished for the day</h3>
            <div class="day-review-note">No scheduled or in-transit jobs left for this driver today.</div>
          </div>
          <button class="btn btn-secondary day-review-close" type="button">Close</button>
        </div>
      </div>`;
  }
  return `
    <div class="day-review">
      <div class="day-review-head">
        <div>
          <h3>Finish day</h3>
          <div class="day-review-note">Complete jobs that were done. Cancel jobs that were not done. Blank pricing is allowed and will not stop upload.</div>
        </div>
        <button class="btn btn-secondary day-review-close" type="button">Close</button>
      </div>
      ${openJobs.map(job => {
        const id = job.id || job.jobId || '';
        return `
          <div class="day-review-job">
            <div class="day-review-title">#${esc(String(getJobNumber(job)))} ${esc(getJobCustomer(job))}</div>
            <div class="day-review-meta">${esc(getJobMaterial(job) || 'No material')}<br>${esc(getJobFrom(job) || '—')} → ${esc(getJobTo(job) || '—')}</div>
            <div class="day-review-actions">
              <button class="btn btn-complete day-review-action" data-day-action="completed" data-job-id="${esc(id)}">Completed</button>
              <button class="btn btn-danger day-review-action" data-day-action="cancelled" data-job-id="${esc(id)}">Cancel</button>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function renderDriverView(container) {
  const jobs = sortJobsForDriver(getDriverJobs(currentUser.driverId, currentUser.name));
  const openJobs = getOpenDayReviewJobs(jobs);
  let finished = getDayFinished();
  if (finished && openJobs.length) {
    clearDayFinished();
    finished = null;
  }
  const queue = renderQueueSummary();
  const selectedVehicle = getSelectedDriverVehicle();
  const canFinishDay = jobs.length && !openJobs.length;
  const walkaroundPanel = renderWalkaroundPanel({ dayClosed: canFinishDay });
  const trialBanner = trialMode ? `
    <div class="trial-banner">
      <strong>${esc(currentUser.name)} — jobs connected to the office</strong><br>
      ${LIVE_WRITE
        ? 'Your jobs, proof and day-sheet rows send back automatically. If the signal drops, the app keeps what you have entered so you can continue when it returns.'
        : 'Your jobs are visible and anything you enter is saved safely for the office.'}
    </div>` : '';
  const summary = `
    ${trialBanner}
    ${walkaroundPanel}
    <div class="driver-summary">
      <h2>${esc(currentUser.name)}</h2>
      <div class="driver-summary-meta">
        <span>${jobs.length} jobs today</span>
        <span>${openJobs.length} still to review</span>
        <span>${selectedVehicle ? `Truck / wagon ${esc(selectedVehicle)}` : 'Truck / wagon not selected'}</span>
        <span>${finished ? 'Finished for the day' : (canFinishDay ? 'Ready to finish day' : 'Day still open')}</span>
      </div>
      <div class="form-group ${isWalkaroundVisible() ? 'hidden' : ''}" style="margin:12px 0 0">
        <label for="driver-vehicle-select">Truck / Wagon today</label>
        <select id="driver-vehicle-select" class="driver-vehicle-select">${vehicleOptionsHTML(selectedVehicle)}</select>
      </div>
      <div class="driver-summary-actions ${jobs.length ? '' : 'hidden'}">
        <button class="btn ${finished ? 'btn-secondary' : (canFinishDay ? 'btn-complete' : 'btn-secondary')}" id="complete-day-btn" type="button">${finished ? 'Re-open / check day' : (canFinishDay ? 'Finished for the day' : 'Complete day')}</button>
        ${finished ? '<button class="btn btn-complete" id="finished-add-row-btn" type="button">Add another day-sheet row</button>' : ''}
      </div>
      ${finished ? `<div class="driver-day-finished">Finished for the day saved at ${esc(new Date(finished.finishedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }))}. Saved-local items do not stop this day being finished.</div>` : ''}
    </div>
    <div class="driver-update">Office changes appear automatically. Last successful update is shown at the top.</div>
    ${renderDayReviewPanel(jobs)}
    ${queue}`;
  if (jobs.length === 0) {
    container.innerHTML = `
      ${summary}
      <div class="empty-state">
        <div class="icon">🚛</div>
        <h3>No jobs today</h3>
        <p>Your jobs from Haultech will appear here.<br>Tap "Add day-sheet row" to add work done.</p>
      </div>`;
    attachDayReviewListeners(container, jobs);
    attachDriverVehicleSelector(container);
    attachWalkaroundPanelListeners(container);
    return;
  }
  container.innerHTML = summary + jobs.map((job, i) => jobCardHTML(job, false, i === 0)).join('');
  attachDayReviewListeners(container, jobs);
  attachDriverVehicleSelector(container);
  attachWalkaroundPanelListeners(container);
  attachCardListeners(container, jobs);
  attachQuickActionListeners(container, jobs);
}

function attachDriverVehicleSelector(container) {
  container.querySelectorAll('.driver-vehicle-select').forEach(select => select.addEventListener('change', e => {
    setSelectedDriverVehicle(e.target.value);
    toast(e.target.value ? `Truck / wagon set to ${e.target.value}` : 'Truck / wagon cleared');
    ensureTorqueChecksForSelectedVehicle({ force: true });
    renderJobs();
  }));
}

function attachDayReviewListeners(container, jobs) {
  const findJob = id => jobs.find(j => String(j.id || j.jobId || '') === String(id));
  container.querySelector('#complete-day-btn')?.addEventListener('click', () => {
    if (getDayFinished()) {
      clearDayFinished();
      dayReviewOpen = true;
      toast('Day re-opened on this phone');
      renderJobs();
      return;
    }
    if (getOpenDayReviewJobs(jobs).length === 0 && jobs.length) {
      saveFinishedForDay(jobs);
      renderJobs();
      return;
    }
    dayReviewOpen = !dayReviewOpen;
    renderJobs();
  });
  container.querySelector('#finished-add-row-btn')?.addEventListener('click', () => {
    clearDayFinished();
    openAddJobModal();
  });
  container.querySelectorAll('.day-review-close').forEach(btn => {
    btn.addEventListener('click', () => {
      dayReviewOpen = false;
      renderJobs();
    });
  });
  container.querySelectorAll('.day-review-action').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const job = findJob(btn.dataset.jobId);
      if (!job) return;
      await handleDayReviewAction(job, btn.dataset.dayAction);
    });
  });
}

async function handleDayReviewAction(job, action) {
  if (action === 'completed') {
    showSignScreen(job);
    return;
  }
  if (action !== 'cancelled') return;
  const ok = window.confirm('Cancel this job? Only press Yes if it was not done today.');
  if (!ok) return;

  const status = 'cancelled';
  const reason = 'Cancelled by driver - not done today';
  const storageKey = getJobConsignmentId(job) || job.id || job.jobId;
  const haultechNote = composeDriverHaultechNote({ reason });
  const event = queueTrialEvent('day_review_cancelled', job, {
    status,
    reason,
    state: 'saved locally',
    haultechWriteState: 'saved locally',
  });

  updateJobStatusLocal(job, status);
  localSaveJobs(todayISO(), allJobs);
  try {
    if (haultechNote) await writeHaultechDriverNoteForJob(job, haultechNote);
  } catch (e) {
    setQueueState(event.eventId, 'failed', e.message || 'Haultech note write failed; local day review still saved on this phone');
  }
  try {
    await api(`/job-status/${storageKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, reason, driver: currentUser.name, date: todayISO() }),
    });
    setQueueState(event.eventId, 'saved locally', `${reason}; not completed in Haultech`);
  } catch (e) {
    setQueueState(event.eventId, 'failed', e.message || 'Worker status save failed; local day review still saved on this phone');
  }
  await saveJobsToCloud(todayISO(), allJobs);
  toast('Job cancelled');
  renderJobs();
}

function getFinishedDayVehicle(jobs) {
  const selected = normaliseVehicleRef(getSelectedDriverVehicle());
  if (selected) return selected;
  const jobVehicles = [...new Set(jobs.map(getJobVehicle).map(normaliseVehicleRef).filter(Boolean))];
  return jobVehicles.length === 1 ? jobVehicles[0] : '';
}

function saveFinishedForDay(jobs) {
  const openJobs = getOpenDayReviewJobs(jobs);
  if (openJobs.length) return false;
  markDriverFailedWritebacksSavedLocally();
  const existing = getDayFinished();
  if (existing) {
    toast('✓ Already marked finished for the day');
    return true;
  }
  const payload = {
    driver: currentUser.name,
    driverId: currentUser.driverId,
    date: todayISO(),
    finishedAt: new Date().toISOString(),
    jobCount: jobs.length,
    vehicle: getFinishedDayVehicle(jobs),
  };
  setDayFinished(payload);
  const fakeJob = { id: `day-${currentUser.driverId || currentUser.name}`, jobId: `day-${currentUser.driverId || currentUser.name}` };
  const event = queueTrialEvent('day_finished', fakeJob, {
    ...payload,
    state: 'written',
    haultechWriteState: 'written',
    reason: 'Driver finished for the day; all jobs reviewed',
  });
  setQueueState(event.eventId, 'written', 'Driver finished for the day; all jobs reviewed');
  dayReviewOpen = false;
  updateSyncUI();
  toast('✓ Finished for the day saved');
  return true;
}

function isWalkaroundVisible() {
  if (WALKAROUND_TEST_OVERRIDE) return true;
  const liveAt = Date.parse(WALKAROUND_VISIBLE_AFTER);
  return Number.isFinite(liveAt) && Date.now() >= liveAt;
}

function scheduleWalkaroundActivationRefresh() {
  if (walkaroundActivationTimer || isWalkaroundVisible()) return;
  const liveAt = Date.parse(WALKAROUND_VISIBLE_AFTER);
  if (!Number.isFinite(liveAt)) return;
  const delay = Math.max(0, Math.min(liveAt - Date.now() + 1000, 2147483647));
  walkaroundActivationTimer = setTimeout(() => {
    walkaroundActivationTimer = null;
    if (currentScreen === 'jobs') renderJobs();
    checkForAppVersionUpdate('walkaround_activation').catch(() => {});
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => reg?.update?.()).catch(() => {});
    }
  }, delay);
}

function safeIdPart(value) {
  return String(value || '').replace(/[^A-Za-z0-9._:-]+/g, '-').replace(/-+/g, '-').slice(0, 72) || 'none';
}

function shortStableHash(value) {
  let hash = 2166136261;
  const text = String(value || '');
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(36);
}

function createWalkaroundRecordId(date, driverRef, vehicle, trailer) {
  const timestamp = Date.now().toString(36);
  const base = `${date}-${driverRef || 'unknown'}-${vehicle || 'no-vehicle'}-${trailer || 'no-trailer'}-${timestamp}`;
  return safeIdPart(`wa-${timestamp}-${shortStableHash(base)}-${base}`);
}

function walkaroundTicketId(recordId) {
  return safeIdPart(`walkaround-${shortStableHash(recordId)}-${recordId}`);
}

function walkaroundAssetId(recordId, kind) {
  return safeIdPart(`waasset-${safeIdPart(kind)}-${shortStableHash(`${recordId}:${kind}`)}-${recordId}`);
}

function walkaroundStorageKeyFor(record = {}) {
  const driver = record.driverId || record.driver || currentUser?.driverId || currentUser?.name || 'unknown';
  const vehicle = record.vehicle || getSelectedDriverVehicle() || 'no-vehicle';
  const trailer = record.trailer || getSelectedDriverTrailer() || 'no-trailer';
  const date = record.date || todayISO();
  return `pmg_walkaround_${date}_${safeIdPart(driver)}_${safeIdPart(vehicle)}_${safeIdPart(trailer)}`;
}

function walkaroundStorageKey(date = todayISO()) {
  return walkaroundStorageKeyFor({ date });
}

function getLocalWalkaroundRecord() {
  if (!currentUser || !getSelectedDriverVehicle()) return null;
  return readJSON(walkaroundStorageKey(), null);
}

function setLocalWalkaroundRecord(record) {
  writeJSON(walkaroundStorageKeyFor(record), record);
}

function normaliseVehicleRef(value) {
  return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function safeList(value) {
  return Array.isArray(value) ? value : [];
}

function torqueCacheKey(vehicle) {
  return `pmg_driver_torque_${normaliseVehicleRef(vehicle)}`;
}

function torqueTaskId(task = {}) {
  return task.taskId || task.eventId || `${normaliseVehicleRef(task.vehicle)}-${task.createdAt || task.date || task.torqueNm || DEFAULT_WHEEL_TORQUE_NM}`;
}

function readCachedTorqueTasks(vehicle) {
  const cached = readJSON(torqueCacheKey(vehicle), null);
  return Array.isArray(cached?.tasks) ? cached.tasks : [];
}

function writeCachedTorqueTasks(vehicle, tasks) {
  writeJSON(torqueCacheKey(vehicle), { tasks: safeList(tasks), cachedAt: new Date().toISOString() });
}

function currentTorqueTasks() {
  const vehicle = normaliseVehicleRef(getSelectedDriverVehicle());
  if (!vehicle) return [];
  if (normaliseVehicleRef(torqueCheckState.vehicle) !== vehicle) return [];
  if (torqueCheckState.loading || torqueCheckState.error) return [];
  return safeList(torqueCheckState.tasks);
}

function torqueConfirmationsFromRecord(record) {
  return [
    ...safeList(record?.torqueChecks),
    ...safeList(record?.torqueConfirmations),
    ...(record?.torqueCheck ? [record.torqueCheck] : []),
  ].filter(item => item && typeof item === 'object');
}

function recordConfirmsTorqueTask(record, task) {
  if (!record) return false;
  if (normaliseVehicleRef(record.vehicle) !== normaliseVehicleRef(task.vehicle || getSelectedDriverVehicle())) return false;
  return torqueConfirmationsFromRecord(record).some(confirmation => {
    if (confirmation.confirmed !== true) return false;
    return confirmation.taskId === torqueTaskId(task) || (confirmation.eventId && confirmation.eventId === task.eventId);
  });
}

function pendingTorqueTasksForSelectedVehicle(record = getLocalWalkaroundRecord()) {
  return currentTorqueTasks().filter(task => !recordConfirmsTorqueTask(record, task));
}

function renderTorqueGateStatus(record = getLocalWalkaroundRecord()) {
  const vehicle = getSelectedDriverVehicle();
  if (!vehicle) return '';
  const vehicleRef = normaliseVehicleRef(vehicle);
  const stateMatches = normaliseVehicleRef(torqueCheckState.vehicle) === vehicleRef;
  const pending = pendingTorqueTasksForSelectedVehicle(record);
  if (pending.length) {
    const amount = pending.map(task => `${task.torqueNm || DEFAULT_WHEEL_TORQUE_NM} Nm`).join(', ');
    return `
      <div class="torque-gate required">
        <div class="torque-gate-title">Wheel torque check due</div>
        <div class="torque-gate-detail">Confirm wheel torque before moving this wagon. Required amount: ${esc(amount)}.</div>
      </div>`;
  }
  if (stateMatches && torqueCheckState.loading) {
    return '';
  }
  if (stateMatches && torqueCheckState.error) {
    return '';
  }
  return '';
}

function ensureTorqueChecksForSelectedVehicle(options = {}) {
  const vehicle = getSelectedDriverVehicle();
  const vehicleRef = normaliseVehicleRef(vehicle);
  if (!vehicleRef) {
    torqueCheckState = { vehicle: '', loading: false, error: '', tasks: [], checkedAt: '', loadedAt: 0 };
    return;
  }
  const now = Date.now();
  const sameVehicle = normaliseVehicleRef(torqueCheckState.vehicle) === vehicleRef;
  if (!options.force && sameVehicle && (torqueCheckState.loading || (now - torqueCheckState.loadedAt < TORQUE_REFRESH_MS))) return;
  torqueCheckState = { vehicle: vehicleRef, loading: true, error: '', tasks: [], checkedAt: torqueCheckState.checkedAt || '', loadedAt: torqueCheckState.loadedAt || 0 };
  fleetApi(`/api/driver-torque?vehicle=${encodeURIComponent(vehicleRef)}`)
    .then(async resp => {
      if (!resp.ok) throw new Error(await responseError(resp, `torque check HTTP ${resp.status}`));
      return resp.json();
    })
    .then(data => {
      const tasks = safeList(data.openTasks);
      torqueCheckState = { vehicle: vehicleRef, loading: false, error: '', tasks, checkedAt: data.checkedAt || new Date().toISOString(), loadedAt: Date.now() };
      writeCachedTorqueTasks(vehicleRef, tasks);
      if (currentScreen === 'jobs') renderJobs();
    })
    .catch(err => {
      torqueCheckState = { vehicle: vehicleRef, loading: false, error: err.message || 'Torque check failed', tasks: [], checkedAt: '', loadedAt: Date.now() };
      writeCachedTorqueTasks(vehicleRef, []);
      if (currentScreen === 'jobs') renderJobs();
    });
}

function selectedWalkaroundLabel() {
  const vehicle = getSelectedDriverVehicle();

  return vehicle ? `${vehicle}${trailer ? ' + ' + trailer : ''}` : '';
}

function hasSelectedWalkaroundComplete() {
  const record = getLocalWalkaroundRecord();
  return !!record && pendingTorqueTasksForSelectedVehicle(record).length === 0;
}

function focusWalkaroundGate() {
  if (currentScreen !== 'jobs') {
    showJobList();
    renderJobs();

  setTimeout(() => {

    if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });

function requireWalkaroundBeforeDriverAction(actionLabel = 'driving') {
  if (!isWalkaroundVisible() || isManager) return true;
  const vehicle = getSelectedDriverVehicle();
  ensureTorqueChecksForSelectedVehicle();
  const pendingTorque = pendingTorqueTasksForSelectedVehicle();
  const done = hasSelectedWalkaroundComplete();
  if (vehicle && done) return true;
  toast(pendingTorque.length
    ? `Confirm wheel torque ${pendingTorque[0].torqueNm || DEFAULT_WHEEL_TORQUE_NM} Nm before ${actionLabel}`
    : (vehicle ? `Complete walkaround for ${vehicle} before ${actionLabel}` : 'Select truck / wagon and complete walkaround first'));
  focusWalkaroundGate();
  return false;
}

function walkaroundTicketQueueKey() {
  return 'pmg_walkaround_ticket_queue_v1';
}

function getPendingWalkaroundTickets() {
  const queue = readJSON(walkaroundTicketQueueKey(), []);
  return Array.isArray(queue) ? queue : [];
}

function setPendingWalkaroundTickets(queue) {
  writeJSON(walkaroundTicketQueueKey(), queue);
}

function queueWalkaroundTicket(record) {
  const queue = getPendingWalkaroundTickets().filter(item => item.recordId !== record.recordId);
  queue.push(record);
  setPendingWalkaroundTickets(queue);
}

async function saveWalkaroundTicketRecord(record) {
  const ticketId = walkaroundTicketId(record.recordId);
  const resp = await api(`/ticket/${ticketId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(record),
  });
  if (!resp.ok) throw new Error(await responseError(resp, `walkaround ticket HTTP ${resp.status}`));
  return true;
}

async function flushWalkaroundTicketQueue(options = {}) {
  const queue = getPendingWalkaroundTickets();
  if (!queue.length) return;
  const remaining = [];
  let synced = 0;
  for (const queued of queue) {
    const record = { ...queued, syncState: 'saved_to_worker', syncError: '', retriedAt: new Date().toISOString() };
    try {
      await saveWalkaroundTicketRecord(record);
      setLocalWalkaroundRecord(record);
      synced += 1;
    } catch (err) {
      remaining.push({ ...queued, syncError: err.message || 'Ticket retry failed' });
    }
  }
  setPendingWalkaroundTickets(remaining);
  if (synced && !options.silent) toast(`Walkaround office sync updated`);
  if (synced && currentScreen === 'jobs') renderJobs();
}

function requiredWalkaroundPhotoSlots() {
  const hasTrailer = !!getSelectedDriverTrailer();
  return WALKAROUND_PHOTO_SLOTS.filter(slot => !slot.trailerOnly || hasTrailer);
}

function defaultWalkaroundChecks() {
  return WALKAROUND_CHECKS.reduce((acc, check) => {
    acc[check.id] = null;
    return acc;
  }, {});
}

function resetWalkaroundState() {
  walkaroundState = {
    checks: defaultWalkaroundChecks(),
    torqueConfirmations: pendingTorqueTasksForSelectedVehicle().reduce((acc, task) => {
      acc[torqueTaskId(task)] = false;
      return acc;
    }, {}),
    photos: {},
    photoDataUrls: {},
    photoCaptureModes: {},
    checksExpanded: false,
    defectNotes: '',
    startedAt: new Date().toISOString(),
  };
  walkaroundSigCtx = null;
  walkaroundSigDrawing = false;
  walkaroundSigHasData = false;
}

function walkaroundDraftIdentity() {
  return {
    date: todayISO(),
    driverId: currentUser?.driverId || '',
    vehicle: getSelectedDriverVehicle() || '',
    trailer: getSelectedDriverTrailer() || '',
  };
}

function walkaroundDraftMatches(draft, identity = walkaroundDraftIdentity()) {
  return !!draft
    && draft.date === identity.date
    && draft.driverId === identity.driverId
    && draft.vehicle === identity.vehicle
    && (draft.trailer || '') === (identity.trailer || '');
}

function saveWalkaroundDraft() {
  if (!walkaroundState) return;
  try {
    const identity = walkaroundDraftIdentity();
    localStorage.setItem(WALKAROUND_DRAFT_KEY, JSON.stringify({
      ...identity,
      active: true,
      checks: walkaroundState.checks || {},
      torqueConfirmations: walkaroundState.torqueConfirmations || {},
      checksExpanded: walkaroundState.checksExpanded === true,
      defectNotes: walkaroundState.defectNotes || '',
      startedAt: walkaroundState.startedAt || new Date().toISOString(),
      photoDataUrls: walkaroundState.photoDataUrls || {},
      photoCaptureModes: walkaroundState.photoCaptureModes || {},
      photoNames: Object.fromEntries(Object.entries(walkaroundState.photos || {}).map(([slot, photo]) => [slot, photo.name || `${slot}.jpg`])),
      updatedAt: new Date().toISOString(),
    }));
  } catch {}
}

function clearWalkaroundDraft() {
  try { localStorage.removeItem(WALKAROUND_DRAFT_KEY); } catch {}
}

function restoreWalkaroundDraftIfMatching() {
  try {
    const draft = JSON.parse(localStorage.getItem(WALKAROUND_DRAFT_KEY) || 'null');
    if (!walkaroundDraftMatches(draft)) return false;
    walkaroundState.checks = { ...defaultWalkaroundChecks(), ...(draft.checks || {}) };
    walkaroundState.torqueConfirmations = { ...walkaroundState.torqueConfirmations, ...(draft.torqueConfirmations || {}) };
    walkaroundState.checksExpanded = draft.checksExpanded === true || Object.values(draft.checks || {}).includes('no');
    walkaroundState.defectNotes = draft.defectNotes || '';
    walkaroundState.startedAt = draft.startedAt || walkaroundState.startedAt;
    walkaroundState.photoDataUrls = draft.photoDataUrls || {};
    walkaroundState.photoCaptureModes = draft.photoCaptureModes || {};
    Object.entries(walkaroundState.photoDataUrls).forEach(([slot, dataUrl]) => {
      const blob = dataURLToBlob(dataUrl);
      walkaroundState.photos[slot] = {
        blob,
        name: draft.photoNames?.[slot] || `${slot}.jpg`,
        type: blob.type || 'image/jpeg',
      };
    });
    return true;
  } catch {
    return false;
  }
}

function walkaroundPhotoSlot(slotId) {
  return requiredWalkaroundPhotoSlots().find(slot => slot.id === slotId) || null;
}

function nextMissingWalkaroundPhoto(currentSlotId = '') {
  const slots = requiredWalkaroundPhotoSlots();
  const currentIndex = slots.findIndex(slot => slot.id === currentSlotId);
  for (let offset = 1; offset <= slots.length; offset += 1) {
    const slot = slots[(Math.max(currentIndex, -1) + offset) % slots.length];
    if (slot && !walkaroundState?.photos?.[slot.id]) return slot;
  }
  return null;
}

function setInlineWalkaroundCameraTarget(slotId) {
  const slot = walkaroundPhotoSlot(slotId) || nextMissingWalkaroundPhoto('');
  if (!slot) return null;
  walkaroundCameraSlotId = slot.id;
  const title = $('walkaround-camera-title');
  const capture = $('walkaround-camera-capture');
  if (title) title.textContent = `${slot.label} photo`;
  if (capture) capture.textContent = `Take ${slot.label} photo`;
  return slot;
}

function stopWalkaroundCamera(options = {}) {
  const stream = walkaroundCameraStream;
  walkaroundCameraStream = null;
  walkaroundCameraStarting = false;
  try { stream?.getTracks?.().forEach(track => track.stop()); } catch {}
  const video = $('walkaround-camera-video');
  if (video) {
    try { video.pause(); } catch {}
    video.srcObject = null;
  }
  $('walkaround-inline-camera')?.classList.add('hidden');
  const capture = $('walkaround-camera-capture');
  if (capture) capture.disabled = true;
  if (!options.preserveSlot) walkaroundCameraSlotId = '';
}

function launchNativeWalkaroundCamera() {
  const slot = walkaroundPhotoSlot(walkaroundCameraSlotId) || nextMissingWalkaroundPhoto('');
  if (!slot) {
    toast('All truck photos saved');
    return;
  }
  walkaroundCameraSlotId = slot.id;
  saveWalkaroundDraft();
  stopWalkaroundCamera({ preserveSlot: true });
  const input = $('walkaround-native-photo-input');
  if (!input) return;
  input.value = '';
  input.click();
}

async function startWalkaroundCamera(slotId) {
  const slot = walkaroundPhotoSlot(slotId) || nextMissingWalkaroundPhoto('');
  if (!slot) {
    toast('All truck photos saved');
    return;
  }
  walkaroundCameraSlotId = slot.id;
  saveWalkaroundDraft();

  if (walkaroundInlineCameraUnavailable || !navigator.mediaDevices?.getUserMedia) {
    launchNativeWalkaroundCamera();
    return;
  }

  const panel = $('walkaround-inline-camera');
  panel?.classList.remove('hidden');
  setInlineWalkaroundCameraTarget(slot.id);
  panel?.scrollIntoView({ block: 'center', behavior: 'smooth' });

  const cameraTracks = walkaroundCameraStream?.getTracks?.() || [];
  if (walkaroundCameraStream && cameraTracks.some(track => !track.readyState || track.readyState === 'live')) {
    const capture = $('walkaround-camera-capture');
    if (capture) capture.disabled = false;
    return;
  }
  if (walkaroundCameraStream) {
    stopWalkaroundCamera({ preserveSlot: true });
    panel?.classList.remove('hidden');
    setInlineWalkaroundCameraTarget(slot.id);
  }
  if (walkaroundCameraStarting) return;

  walkaroundCameraStarting = true;
  const status = $('walkaround-camera-status');
  if (status) status.textContent = 'Starting rear camera...';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    });
    if (currentScreen !== 'walkaround') {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    walkaroundCameraStream = stream;
    const video = $('walkaround-camera-video');
    if (video) {
      video.srcObject = stream;
      await video.play().catch(() => {});
    }
    if (status) status.textContent = 'Camera stays open. Walk round the wagon after each photo.';
    const capture = $('walkaround-camera-capture');
    if (capture) capture.disabled = false;
  } catch {
    walkaroundInlineCameraUnavailable = true;
    if (status) status.textContent = 'Built-in camera could not open. Tap “Use phone camera instead”.';
    toast('Use phone camera instead');
  } finally {
    walkaroundCameraStarting = false;
  }
}

function inlineWalkaroundCameraBlob() {
  return new Promise((resolve, reject) => {
    const video = $('walkaround-camera-video');
    const width = Number(video?.videoWidth || 0);
    const height = Number(video?.videoHeight || 0);
    if (!video || !width || !height) {
      reject(new Error('Camera is not ready'));
      return;
    }
    const maxSide = 960;
    const scale = Math.min(1, maxSide / Math.max(width, height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('Camera photo could not be saved'));
    }, 'image/jpeg', 0.68);
  });
}

async function storeWalkaroundPhoto(slotId, blob, name, captureMode, options = {}) {
  const slot = walkaroundPhotoSlot(slotId);
  if (!slot || !blob) throw new Error('Walkaround photo slot is unavailable');
  const dataUrl = await blobToDataURL(blob);
  walkaroundState.photos[slot.id] = { blob, name: name || `${slot.id}.jpg`, type: blob.type || 'image/jpeg' };
  walkaroundState.photoDataUrls[slot.id] = dataUrl;
  walkaroundState.photoCaptureModes[slot.id] = captureMode;
  const wrap = document.querySelector(`.walkaround-photo[data-photo-slot="${slot.id}"]`);
  if (wrap) {
    wrap.classList.add('captured');
    const state = wrap.querySelector('.walkaround-photo-state');
    if (state) state.textContent = 'Saved on this phone';
    const button = wrap.querySelector('.walk-photo-btn');
    if (button) button.textContent = 'Retake photo';
  }
  updateWalkaroundPhotoProgress();
  saveWalkaroundDraft();
  return focusNextWalkaroundPhoto(slot.id, options);
}

async function closeConfirmedFleetTorqueTasks(torqueChecks) {

    try {
      const resp = await fleetApi(`/api/torque/${encodeURIComponent(check.eventId)}/driver-complete`, { method: 'POST' });
      if (!resp.ok) throw new Error(await responseError(resp, `torque close HTTP ${resp.status}`));
      results.push({ eventId: check.eventId, closed: true });
    } catch (err) {
      results.push({ eventId: check.eventId, closed: false, error: err.message || 'Fleet torque close failed' });

function initWalkaroundSignatureCanvas() {
  const canvas = $('walkaround-sig-canvas');
  if (!canvas) return;
  if (canvas.dataset.ready === '1') return;
  canvas.dataset.ready = '1';
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.max(280, Math.floor(rect.width));
  canvas.height = 170;
  walkaroundSigCtx = canvas.getContext('2d');
  walkaroundSigCtx.strokeStyle = '#111827';
  walkaroundSigCtx.lineWidth = 2.5;
  walkaroundSigCtx.lineCap = 'round';
  walkaroundSigCtx.lineJoin = 'round';
  walkaroundSigHasData = false;

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    walkaroundSigDrawing = true;
    walkaroundSigHasData = true;
    const pos = sigPos(e, canvas);
    walkaroundSigCtx.beginPath();
    walkaroundSigCtx.moveTo(pos.x, pos.y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!walkaroundSigDrawing) return;
    e.preventDefault();
    const pos = sigPos(e, canvas);
    walkaroundSigCtx.lineTo(pos.x, pos.y);
    walkaroundSigCtx.stroke();
  });
  canvas.addEventListener('pointerup', () => walkaroundSigDrawing = false);
  canvas.addEventListener('pointerleave', () => walkaroundSigDrawing = false);
  $('walkaround-sig-clear')?.addEventListener('click', () => {
    walkaroundSigCtx.clearRect(0, 0, canvas.width, canvas.height);
    walkaroundSigHasData = false;
  });
}

function getWalkaroundSignatureData() {
  if (!walkaroundSigHasData) return null;
  return $('walkaround-sig-canvas')?.toDataURL('image/png') || null;
}

function dataURLToBlob(dataUrl) {
  const [meta, data] = String(dataUrl || '').split(',');
  const mime = (meta.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const binary = atob(data || '');
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Photo could not be saved'));
    reader.readAsDataURL(blob);
  });
}

function compressImageFile(file) {
  return new Promise(resolve => {
    if (!file || !String(file.type || '').startsWith('image/')) {
      resolve(file);
      return;
    }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      // Keep four mandatory phone photos small enough for draft restore on iOS
      // while retaining enough detail for office/compliance review.
      const maxSide = 960;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => resolve(blob || file), 'image/jpeg', 0.62);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      resolve(file);
    };
    img.src = objectUrl;
  });
}

async function uploadWalkaroundAsset(recordId, kind, blob) {
  const assetId = walkaroundAssetId(recordId, kind);
  const resp = await fetch(WORKER_URL + `/photos/${assetId}`, {

    headers: { 'X-PMG-Key': API_KEY, 'Content-Type': blob.type || 'application/octet-stream' },
    body: blob,
  });
  if (!resp.ok) throw new Error(await responseError(resp, `${kind} upload HTTP ${resp.status}`));
  return { kind, assetId, url: `${WORKER_URL}/photos/${assetId}` };
}

function validateWalkaroundBeforeComplete() {
  const missing = [];
  const vehicle = getSelectedDriverVehicle();
  if (!vehicle) missing.push('select truck / wagon');
  requiredWalkaroundPhotoSlots().forEach(slot => {
    if (!walkaroundState.photos?.[slot.id]) missing.push(`${slot.label} photo`);
  });
  WALKAROUND_CHECKS.forEach(check => {
    if (!walkaroundState.checks[check.id]) missing.push(check.label);
  });
  pendingTorqueTasksForSelectedVehicle().forEach(task => {
    if (walkaroundState.torqueConfirmations?.[torqueTaskId(task)] !== true) {
      missing.push(`wheel torque ${task.torqueNm || DEFAULT_WHEEL_TORQUE_NM} Nm`);
    }
  });
  const failedChecks = Object.entries(walkaroundState.checks).filter(([, value]) => value === 'no');
  if (failedChecks.length && !$('walkaround-defect-notes')?.value.trim()) missing.push('defect notes');
  return missing;
}

async function completeWalkaround() {
  if (!walkaroundState) return;
  const missing = validateWalkaroundBeforeComplete();
  if (missing.length) {
    toast(`Missing: ${missing.slice(0, 2).join(', ')}${missing.length > 2 ? '...' : ''}`);
    return;
  }

  stopWalkaroundCamera();

  const btn = $('walkaround-complete-btn');
  btn.disabled = true;
  btn.textContent = 'Saving walkaround...';

  const date = todayISO();
  const vehicle = getSelectedDriverVehicle();
  const trailer = getSelectedDriverTrailer();
  const recordId = createWalkaroundRecordId(date, currentUser?.driverId || currentUser?.name, vehicle, trailer);
  const signatureData = getWalkaroundSignatureData();
  const signatureBlob = signatureData ? dataURLToBlob(signatureData) : null;
  const torqueTasks = pendingTorqueTasksForSelectedVehicle();
  const torqueChecks = torqueTasks.map(task => ({
    taskId: torqueTaskId(task),
    eventId: task.eventId || '',
    assetId: task.assetId || '',
    vehicle,
    torqueNm: task.torqueNm || DEFAULT_WHEEL_TORQUE_NM,
    confirmed: walkaroundState.torqueConfirmations?.[torqueTaskId(task)] === true,
    confirmedAt: new Date().toISOString(),
    sourceName: task.sourceName || '',
  }));
  const failedChecks = WALKAROUND_CHECKS
    .filter(check => walkaroundState.checks[check.id] === 'no')
    .map(check => ({ id: check.id, label: check.label }));
  let syncState = 'saved_locally';
  let syncError = '';
  let assets = [];

  const baseRecord = {
    recordId,
    type: 'driver_walkaround',
    date,
    driver: currentUser?.name || '',
    driverId: currentUser?.driverId || '',
    vehicle,
    trailer,
    checks: walkaroundState.checks,
    torqueChecks,
    defects: failedChecks,
    defectNotes: $('walkaround-defect-notes')?.value.trim() || '',
    photoSlotsExpected: requiredWalkaroundPhotoSlots().map(slot => slot.id),
    photoSlots: requiredWalkaroundPhotoSlots().map(slot => slot.id),
    photoCaptureModes: { ...walkaroundState.photoCaptureModes },
    photoEvidenceRequired: true,
    signatureProvided: !!signatureBlob,
    signatureOptional: true,
    startedAt: walkaroundState.startedAt,
    completedAt: new Date().toISOString(),
    appBuildId: APP_BUILD_ID,
    devicePlatform: navigator.userAgentData?.platform || navigator.platform || '',
    installedDisplayMode: window.matchMedia?.('(display-mode: standalone)')?.matches ? 'standalone' : 'browser',
    mode: 'required_prestart_gate',
    jobsLocked: true,
  };

  try {
    const uploads = [];
    for (const [slot, photo] of Object.entries(walkaroundState.photos)) {
      uploads.push(uploadWalkaroundAsset(recordId, slot, photo.blob));
    }
    if (signatureBlob) uploads.push(uploadWalkaroundAsset(recordId, 'signature', signatureBlob));
    assets = await Promise.all(uploads);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Complete pre-start';
    toast('Walkaround not saved - try again with signal');
    return;
  }

  const workerRecord = { ...baseRecord, assets, syncState: 'saved_to_worker', syncError: '' };
  try {
    await saveWalkaroundTicketRecord(workerRecord);
    syncState = 'saved_to_worker';
  } catch (err) {
    syncState = 'ticket_pending';
    syncError = err.message || 'Ticket save failed';
  }

  const localRecord = { ...baseRecord, assets, syncState, syncError };
  const torqueCloseResults = await closeConfirmedFleetTorqueTasks(torqueChecks);
  if (torqueCloseResults.length) {
    localRecord.torqueCloseResults = torqueCloseResults;
    const closeFailures = torqueCloseResults.filter(result => !result.closed);
    if (!closeFailures.length) {
      torqueCheckState = { vehicle: normaliseVehicleRef(vehicle), loading: false, error: '', tasks: [], checkedAt: new Date().toISOString(), loadedAt: Date.now() };
      writeCachedTorqueTasks(vehicle, []);
    } else {
      localRecord.syncError = [localRecord.syncError, `Fleet torque close failed for ${closeFailures.length} item(s)`].filter(Boolean).join('; ');
    }
  }
  setLocalWalkaroundRecord(localRecord);
  clearWalkaroundDraft();
  if (syncState === 'ticket_pending') queueWalkaroundTicket(localRecord);
  toast(syncState === 'saved_to_worker' ? '✓ Walkaround complete' : 'Walkaround proof saved - office sync pending');
  showJobList();
  renderJobs();
  window.scrollTo({ top: 0, behavior: 'auto' });
  reloadForPendingServiceWorkerUpdate();
}

async function updateDriverJobPaymentStatus(job, paymentStatus, container) {
  const status = normalisePaymentStatus(paymentStatus);
  const jobId = getHaultechJobId(job);
  if (!status || !jobId || !isDriverAddedJob(job)) {
    toast('Payment can only be changed on a saved driver row');
    return;
  }
  const buttons = Array.from(container.querySelectorAll('.job-payment-option'));
  buttons.forEach(button => { button.disabled = true; });
  try {
    const resp = await api(`/ht/payment/${encodeURIComponent(jobId)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: getHaultechJobDate(job),
        lookupDates: driverNoteLookupDates(job),
        paymentStatus: status,
      }),
    });
    if (!resp.ok) throw new Error(await responseError(resp, 'Payment update failed'));
    const result = await resp.json().catch(() => ({}));
    const savedStatus = normalisePaymentStatus(result.paymentStatus) || status;
    setJobPaymentStatus(job, savedStatus);
    const localDate = getHaultechJobDate(job);
    const localJobs = localGetJobs(localDate).map(localJob => {
      const ids = [localJob.id, localJob.jobId, localJob.ticketNo].filter(Boolean).map(String);
      if (ids.includes(String(jobId))) setJobPaymentStatus(localJob, savedStatus);
      return localJob;
    });
    localSaveJobs(localDate, localJobs);
    const activeTab = document.querySelector('.detail-tab.active')?.dataset.tab || 'delivery';
    renderJobDetail(job, activeTab);
    toast(savedStatus === 'paid' ? 'Payment marked Paid' : 'Payment marked Not paid');
  } catch (error) {
    toast('Payment update failed: ' + (error.message || 'Unknown error'));
    buttons.forEach(button => { button.disabled = false; });
  }
}

// Sign canvas
let signSigCtx = null;
let signSigDrawing = false;
let signSigHasData = false;

function initSignCanvas() {
  const canvas = $('sign-sig-canvas');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 200;
  signSigCtx = canvas.getContext('2d');
  signSigCtx.strokeStyle = '#111827';
  signSigCtx.lineWidth = 2.5;
  signSigCtx.lineCap = 'round';
  signSigCtx.lineJoin = 'round';
  signSigHasData = false;

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    signSigDrawing = true;
    signSigHasData = true;
    const pos = sigPos(e, canvas);
    signSigCtx.beginPath();
    signSigCtx.moveTo(pos.x, pos.y);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!signSigDrawing) return;
    e.preventDefault();
    const pos = sigPos(e, canvas);
    signSigCtx.lineTo(pos.x, pos.y);
    signSigCtx.stroke();
  });
  canvas.addEventListener('pointerup', () => signSigDrawing = false);
  canvas.addEventListener('pointerleave', () => signSigDrawing = false);

  $('sign-sig-clear')?.addEventListener('click', () => {
    signSigCtx.clearRect(0, 0, canvas.width, canvas.height);
    signSigHasData = false;
  });
}

function sigPos(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}

function getSignSigData() {
  if (!signSigHasData) return null;
  return $('sign-sig-canvas')?.toDataURL('image/png') || null;
}

async function responseError(resp, fallback) {
  const text = await resp.text().catch(() => '');
  if (!text) return fallback || `HTTP ${resp.status}`;
  try {
    const parsed = JSON.parse(text);
    return parsed.error || parsed.message || text.slice(0, 160);
  } catch {
    return text.slice(0, 160);
  }
}

async function writeHaultechDriverNoteForJob(job, driverNotes) {
  const haultechJobId = getHaultechJobId(job);
  if (!LIVE_WRITE || !haultechJobId || job?._cached || isDriverAddedJob(job)) {
    return { ok: false, skipped: true };
  }
  const resp = await api(`/ht/note/${haultechJobId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      date: getHaultechJobDate(job),
      lookupDates: driverNoteLookupDates(job),
      driverNotes,
    }),
  });
  if (!resp.ok) throw new Error(await responseError(resp, 'Driver note write failed'));
  return resp.json().catch(() => ({ ok: true }));
}

async function uploadProofAsset(consId, storageKey, kind, contentType, body) {
  const result = {
    kind,
    attemptedHaultech: true,
    haultechUploaded: false,
    fallbackSaved: false,
    error: '',
  };
  try {
    const resp = await api(`/ht/mpod/${consId}`, {
      method: 'POST',
      headers: { 'Content-Type': contentType },
      body,
    });
    if (!resp.ok) throw new Error(await responseError(resp, `${kind} upload HTTP ${resp.status}`));
    result.haultechUploaded = true;
    return result;
  } catch (e) {
    result.error = e.message || `${kind} upload failed`;
  }

  try {
    const prefix = kind === 'signature' ? 'sig' : 'pod';
    const fallbackResp = await fetch(WORKER_URL + `/photos/${prefix}-${storageKey}-${Date.now()}`, {
      method: 'PUT',
      headers: { 'X-PMG-Key': API_KEY },
      body,
    });
    if (!fallbackResp.ok) throw new Error(await responseError(fallbackResp, `${kind} fallback HTTP ${fallbackResp.status}`));
    result.fallbackSaved = true;
  } catch (fallbackError) {
    result.error = `${result.error}; fallback failed: ${fallbackError.message || fallbackError}`;
  }
  return result;
}

function summarizeProofResults(results) {
  if (!results.length) return 'No photo/signature supplied; Haultech complete only';
  return results.map(r => {
    if (r.haultechUploaded) return `${r.kind}: uploaded to Haultech`;
    if (r.fallbackSaved) return `${r.kind}: Haultech upload failed, saved to office queue (${r.error})`;
    return `${r.kind}: Haultech upload failed and fallback failed (${r.error})`;
  }).join('; ');
}

function hasUnsavedSignProof() {
  if (currentScreen !== 'sign') return false;
  // Do not interrupt the proof screen; even an empty signature/photo form may
  // be mid-capture on a driver's phone.
  return true;

function hasUnsavedWalkaroundWork() {
  return currentScreen === 'walkaround';
}

function modalOpen(id) {
  const el = $(id);
  return !!el && !el.classList.contains('hidden');
}

function hasUnsavedModalWork() {
  if (modalOpen('add-job-modal')) return true;
  if (modalOpen('problem-modal')) return true;
  if (modalOpen('feedback-modal')) return true;
  return false;
}

function hasUnsafeUpdateReloadState() {
  return hasUnsavedSignProof() || hasUnsavedWalkaroundWork() || hasUnsavedModalWork();
}

function reloadForPendingServiceWorkerUpdate() {
  if ((!pendingServiceWorkerReload && !pendingAppVersionReload) || hasUnsafeUpdateReloadState()) return;
  pendingServiceWorkerReload = false;
  pendingAppVersionReload = false;

}

// Save/submit button
async function handleSignComplete() {
  if (!activeJob) return;
  const job = activeJob;
  const matchedLiveJob = (job._cached || isDriverAddedJob(job)) ? findMatchingLiveDriverJob(job) : null;
  const haultechCompleteJob = matchedLiveJob || job;
  const consId = getJobConsignmentId(haultechCompleteJob) || getJobConsignmentId(job);
  const haultechJobId = getHaultechJobId(haultechCompleteJob);
  // A driver-added row with a real Haultech id is a live row and must follow
  // the same proof-first completion path as an office-created row.  The old
  // condition treated every cached driver row as local-only, even after
  // /ht/driver-add had returned a real GUID, so signed jobs stayed Scheduled.
  const isDriverAdded = !haultechJobId;
  const storageKey = consId || haultechJobId || job.id;

  const concreteSourceRequired = jobRequiresConcreteSource(haultechCompleteJob);
  const concreteType = $('sign-concrete-type')?.value || '';
  if (concreteSourceRequired && !concreteType) {
    toast('Choose quarried or recycled before completing');
    $('sign-concrete-type')?.focus();
    return;
  }

  setSignCompleteBusy(true);

  const consignee = $('sign-consignee')?.value?.trim() || '';
  const notes = $('sign-notes')?.value?.trim() || '';
  const weight = $('sign-weight')?.value || '0';
  const haultechDriverNote = composeDriverHaultechNote({ note: notes, consignee });
  const mergedNotes = applyDriverCompletionNote(job, haultechDriverNote || notes);
  const sigData = getSignSigData();
  const wtn = getJobWasteTransferNote(job);
  let proofEvent = null;

  try {
    proofEvent = queueTrialEvent('proof_complete', job, {
      consigneeName: consignee,
      driverNotes: notes,
      notes: mergedNotes,
      weight: parseFloat(weight) || 0,
      wtn,
      wasteTransferNote: wtn,
      hasSignature: !!sigData,
      hasPhoto: !!signPhotoFile,
      concreteType,
      state: LIVE_WRITE ? 'pending Haultech' : 'saved locally',
      haultechWriteState: LIVE_WRITE ? 'pending Haultech' : 'saved locally',
    });

    if (LIVE_WRITE && !isDriverAdded) {
      const proofResults = [];
      if (!signPhotoFile && !sigData) {
        setQueueState(proofEvent.eventId, 'failed', 'Not completed in Haultech; no photo or signature supplied');
        toast('⚠️ Add a photo or signature, then tap Complete job');
        return;
      }

      // Save proof before completing. Haultech's MPOD endpoint is not reliable
      // for this tenant, so worker KV fallback is treated as protected proof.
      if (signPhotoFile) {
        const photoData = await signPhotoFile.arrayBuffer();
        proofResults.push(await uploadProofAsset(consId, storageKey, 'photo', signPhotoFile.type || 'image/jpeg', photoData));
      }

      if (sigData) {
        const sigBlob = await (await fetch(sigData)).arrayBuffer();
        proofResults.push(await uploadProofAsset(consId, storageKey, 'signature', 'image/png', sigBlob));
      }

      const proofSummary = summarizeProofResults(proofResults);
      const missingHaultechProof = proofResults.filter(r => !r.haultechUploaded);
      const failedFallbacks = proofResults.filter(r => !r.haultechUploaded && !r.fallbackSaved);
      if (failedFallbacks.length) {
        setQueueState(
          proofEvent.eventId,
          'failed',
          `Not completed in Haultech; proof did not upload cleanly: ${proofSummary}`
        );
        toast('⚠️ Proof upload failed — not completed');
        return;
      }

      // Complete in Haultech only after supplied proof has been protected either
      // in Haultech or in the PMG worker fallback store.
      const completeResp = await api(`/ht/complete/${haultechJobId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date: getHaultechJobDate(haultechCompleteJob),
          lookupDates: driverNoteLookupDates(haultechCompleteJob),
          driverNotes: haultechDriverNote || notes,
          consigneeName: consignee,
          originalReference: job.reference || job.customerReference || job._reference || getJobRef(job),
          quantity: parseFloat(weight) || 0,
          weight: parseFloat(weight) || 0,
          concreteType,
        }),
      });
      if (!completeResp.ok) {
        throw new Error(await responseError(completeResp, 'Complete failed'));
      }
      const completionCheck = await verifyHaultechCompletion(haultechCompleteJob, haultechJobId);

      // Save POD metadata
      try {
        await fetch(WORKER_URL + `/ticket/pod-${storageKey}`, {
          method: 'PUT',
          headers: { 'X-PMG-Key': API_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            consignmentId: consId, podCode: 'success', podCodeId: POD_CODES.success,
            consigneeName: consignee, driverNotes: notes, notes: mergedNotes, weight: parseFloat(weight) || 0,
            wtn, wasteTransferNote: wtn,
            hasSignature: !!sigData, hasPhoto: !!signPhotoFile,
            concreteType,
            driver: currentUser.name, timestamp: new Date().toISOString(),
          }),
        });
      } catch {}

      updateJobStatusLocal(job, 'complete');
      if (matchedLiveJob) updateJobStatusLocal(matchedLiveJob, 'complete');
      await saveJobsToCloud(todayISO(), allJobs);
      const proofState = completionCheck.ok && !missingHaultechProof.length ? 'written' : 'saved locally';
      const proofMessage = completionCheck.ok
        ? (missingHaultechProof.length
            ? `Haultech complete verified; proof saved in PMG fallback: ${proofSummary}`
            : `Haultech complete verified; ${proofSummary}`)
        : `Haultech complete call returned OK but raw diary check did not verify received/completed: ${completionCheck.reason}. ${proofSummary}`;
      setQueueState(proofEvent.eventId, proofState, proofMessage);
      toast(completionCheck.ok ? (missingHaultechProof.length ? '✓ Completed — proof saved' : '✓ Completed — Haultech verified') : '✓ Completed — sync check pending');
    } else {
      // Trial mode, driver-added, or cached job: safe local + worker KV only.
      if (sigData) {
        try {
          const sigBlob = await (await fetch(sigData)).arrayBuffer();
          await fetch(WORKER_URL + `/photos/sig-${storageKey}-${Date.now()}`, {
            method: 'PUT', headers: { 'X-PMG-Key': API_KEY }, body: sigBlob,
          });
        } catch {}
      }
      if (signPhotoFile) {
        try {
          const photoData = await signPhotoFile.arrayBuffer();
          await fetch(WORKER_URL + `/photos/pod-${storageKey}-${Date.now()}`, {
            method: 'PUT', headers: { 'X-PMG-Key': API_KEY }, body: photoData,
          });
        } catch {}
      }
      try {
        await fetch(WORKER_URL + `/ticket/pod-${storageKey}`, {
          method: 'PUT',
          headers: { 'X-PMG-Key': API_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jobId: storageKey, podCode: 'success', consigneeName: consignee,
            driverNotes: notes, notes: mergedNotes, weight: parseFloat(weight) || 0,
            wtn, wasteTransferNote: wtn,
            hasSignature: !!sigData, hasPhoto: !!signPhotoFile,
            concreteType,
            driver: currentUser.name, timestamp: new Date().toISOString(),
          }),
        });
      } catch {}

      try {
        await api(`/job-status/${storageKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'complete', driver: currentUser.name, date: todayISO() }),
        });
      } catch {}

      updateJobStatusLocal(job, 'complete');
      await saveJobsToCloud(todayISO(), allJobs);
      setQueueState(proofEvent.eventId, LIVE_WRITE ? 'pending Haultech' : 'saved locally', LIVE_WRITE ? 'Waiting for Haultech writer' : 'Proof saved locally');
      toast('✓ Complete saved');
    }

    showJobList();
    renderJobs();
    reloadForPendingServiceWorkerUpdate();
  } catch (e) {
    if (proofEvent) {
      setQueueState(proofEvent.eventId, 'failed', e.message || 'Live Haultech complete/proof failed');
    }
    toast('Error: ' + e.message);
  } finally {
    setSignCompleteBusy(false);
  }
}

async function departJob(job, btn) {
  if (!requireWalkaroundBeforeDriverAction('Start / In Transit')) return;
  const consId = getJobConsignmentId(job);
  const isDriverAdded = !consId || job._driverAdded || (job.id && String(job.id).startsWith('driver-'));
  const storageKey = consId || job.id || job.jobId;

  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    updateJobStatusLocal(job, 'started');
    localSaveJobs(todayISO(), allJobs);
    const event = queueTrialEvent('started', job, {
      status: 'started',
      state: 'written',
      haultechWriteState: 'written',
      localOnly: true,
      haultechWrite: false,
    });
    try {
      await api(`/job-status/${storageKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'started', driver: currentUser.name, date: todayISO() }),
      });
      setQueueState(event.eventId, 'written', 'Started status saved locally and in PMG worker; no Haultech write');
    } catch (e) {
      setQueueState(event.eventId, 'failed', e.message || 'Worker status save failed; local status is still saved on this phone');
    }
    if (currentScreen === 'jobs') renderJobs();
    toast('In Transit saved');
  } catch (e) {
    toast('Error: ' + (e.message || 'Start failed'));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Start / In Transit'; }
  }
}

function clearSelectedAddress(key) {

function selectStructuredAddress(key, address) {

    address?.line1, address?.line2, address?.line3, address?.line4, address?.postcode,
  ].filter(Boolean).join(', ');

function renderAddressSuggestions(key, suggestions) {
  const dropdown = $(`f-${key}-address-dropdown`);
  if (!suggestions.length) {
    dropdown.classList.add('hidden');
    dropdown.innerHTML = '';
    return;
  }
  dropdown.innerHTML = suggestions.map((item, index) => `
    <button type="button" class="address-suggestion" data-address-index="${index}">
      <strong>${esc(item.mainText || item.label || item.text)}</strong>
      <span>${esc(item.secondaryText || (item.address?.postcode ? item.address.formattedAddress : 'Saved PMG location'))}</span>
    </button>
  `).join('') + (suggestions.some(item => item.geoapify)
    ? '<div style="padding:7px 12px;text-align:right;color:var(--muted);font-size:11px">Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a></div>'
    : '');
  dropdown.classList.remove('hidden');
  dropdown.querySelectorAll('[data-address-index]').forEach(button => {
    button.addEventListener('click', () => {
      const item = suggestions[Number(button.dataset.addressIndex)];
      if (item.address) {
        selectStructuredAddress(key, item.address);
        return;
      }
      $(`f-${key}`).value = item.text || item.mainText || '';
      clearSelectedAddress(key);
      dropdown.classList.add('hidden');
    });
  });
}

async function searchAddresses(key, query) {
  const q = String(query || '').trim();
  const state = addressSearchState[key];
  const requestId = ++state.requestId;
  const saved = SAVED_ADDRESSES
    .filter(item => item.searchText.toLowerCase().includes(q.toLowerCase()))
    .map(item => ({ ...item, mainText: item.label, secondaryText: item.address.formattedAddress }));
  if (q.length < 3) {
    renderAddressSuggestions(key, saved);
    return;
  }
  try {
    const response = await api('/address/autocomplete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: q }),
    });
    const result = await response.json().catch(() => ({}));
    if (requestId !== state.requestId) return;
    if (!response.ok) {
      renderAddressSuggestions(key, saved);
      if (result.error === 'address_search_not_configured') {
        addressStatus(key, 'Address search setup is temporarily unavailable');
      }
      return;
    }
    renderAddressSuggestions(key, [...saved, ...(result.suggestions || []).map(item => ({ ...item, geoapify: true }))]);
  } catch {
    if (requestId === state.requestId) renderAddressSuggestions(key, saved);
  }
}
