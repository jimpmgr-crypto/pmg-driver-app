function driverEnteredPricePayload(quantity, unit) {
  if (!canCurrentUserPriceJobs()) return null;
  const raw = $('f-price')?.value;
  if (raw === undefined || raw === null || String(raw).trim() === '') return null;
  const value = parseFloat(raw);
  if (!Number.isFinite(value) || value <= 0) return null;
  const mode = $('f-price-mode')?.value === 'fixed' ? 'fixed' : 'rate';
  const qty = parseFloat(quantity) || 0;
  const quotedPrice = mode === 'fixed' ? value : value * qty;
  if (!Number.isFinite(quotedPrice) || quotedPrice <= 0) return null;
  return {
    mode,
    input: value,
    quotedPrice: Math.round(quotedPrice * 100) / 100,
    unit: unit || 't',
  };
}

function unitForMaterial(material) {
  const pricing = MATERIAL_PRICING[material];
  if (!pricing) return '';
  if (pricing.unit === 'tonnes') return 't';
  if (pricing.unit === 'bags') return 'bags';
  if (pricing.unit === 'days') return 'days';
  if (pricing.unit === 'weeks') return 'weeks';
  if (pricing.unit === 'each' || pricing.unit === 'job') return 'each';
  return pricing.unit || '';
}

function rateForMaterial(material, qty) {
  const pricing = MATERIAL_PRICING[material];
  if (!pricing) return null;
  if (pricing.type === 'banded' && Array.isArray(pricing.bands)) {
    const q = parseFloat(qty) || 0;
    const band = pricing.bands.find(b => q >= b.min) || pricing.bands[pricing.bands.length - 1];
    return band ? band.rate : null;
  }
  if (pricing.type === 'tiered') return (parseFloat(qty) || 0) >= 10 ? pricing.over10 : pricing.under10;
  return pricing.rate;
}

function normaliseVehicleReg(value) {
  return String(value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function isVolumetricConcreteVehicle(vehicle) {
  const reg = normaliseVehicleReg(vehicle);
  return VOLUMETRIC_CONCRETE_VEHICLES.has(reg) || reg.includes('LL21') || reg.includes('FLF');
}

function isConcreteEntryCandidate({ vehicle, material, unit, notes } = {}) {
  const selectedVehicle = vehicle ?? $('f-vehicle')?.value ?? '';
  const selectedMaterial = material ?? $('f-material')?.value ?? '';
  const selectedUnit = String(unit ?? $('f-unit')?.value ?? '').toLowerCase();
  const selectedNotes = notes ?? $('f-notes')?.value ?? '';
  const text = `${selectedMaterial} ${selectedNotes}`;
  return isVolumetricConcreteVehicle(selectedVehicle)
    || ['m3', 'm³', 'cube', 'cubes'].includes(selectedUnit)
    || /\b(?:concrete|m3|m³|cube|cubes|c\d{2}|rc\d{2})\b/i.test(text);
}

function initAddJobSig() {
  fSigCanvas = $('f-sig-canvas');
  fSigCtx = fSigCanvas.getContext('2d');
  fSigCtx.strokeStyle = '#f97316'; fSigCtx.lineWidth = 2; fSigCtx.lineCap = 'round';
  const getPos = e => { const r = fSigCanvas.getBoundingClientRect(); const src = e.touches?.[0] || e; return {x:(src.clientX-r.left)*(fSigCanvas.width/r.width),y:(src.clientY-r.top)*(fSigCanvas.height/r.height)}; };
  fSigCanvas.addEventListener('pointerdown', e => { fSigDrawing=true; const p=getPos(e); fSigCtx.beginPath(); fSigCtx.moveTo(p.x,p.y); e.preventDefault(); });
  fSigCanvas.addEventListener('pointermove', e => { if(!fSigDrawing) return; const p=getPos(e); fSigCtx.lineTo(p.x,p.y); fSigCtx.stroke(); e.preventDefault(); });
  fSigCanvas.addEventListener('pointerup', ()=>fSigDrawing=false);
  fSigCanvas.addEventListener('pointerleave', ()=>fSigDrawing=false);
  $('f-sig-clear').addEventListener('click', ()=>{ fSigCtx.clearRect(0,0,fSigCanvas.width,fSigCanvas.height); });
  $('f-photo').addEventListener('change', e => {
    fPhotoFile = e.target.files[0];
    if (fPhotoFile) { const r=new FileReader(); r.onload=ev=>{ const img=$('f-photo-preview'); img.src=ev.target.result; img.style.display='block'; $('f-photo-btn').textContent='📷 Change Photo'; }; r.readAsDataURL(fPhotoFile); }
  });
}

function isBlankCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
  return !data.some(v => v !== 0);
}

function findCustomerMatches(query, limit = 12) {
  const q = String(query || '').trim().toLowerCase();
  const source = customers.slice().sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
  if (!q) return source.slice(0, limit);
  return source.filter(c => {
    const haystack = [c.name, c.code, ...(Array.isArray(c.aliases) ? c.aliases : [])]
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    return haystack.includes(q);
  }).slice(0, limit);
}

      status: 'scheduled',

      paymentStatus: a1PaymentStatus,
      wtn,
      wasteTransferNote: wtn,
      ewcCode: wtn?.ewcCode || '',
      sicCode: wtn?.sicCode || '',
      containment: wtn?.containment || '',
      wasteHierarchyApplied: wtn ? wtn.wasteHierarchyApplied !== false : false,
      savedAt: new Date().toISOString(),
      ticketNo: ref || ('local-' + Date.now()),
      _driverAdded: true,
    };
    const existingLocal = localGetJobs(localDate);
    existingLocal.push(localJob);
    localStorage.setItem('pmg_local_jobs_' + localDate, JSON.stringify(existingLocal));
    if (LIVE_WRITE) addToRetryQueue(localDate, existingLocal);
    let haultechWriteState = 'saved locally';
    let haultechReason = DRIVER_ADDED_BACKUP_REASON;
    let confirmedJobId = localJob.id;
    if (LIVE_WRITE) {
      try {
        const liveResp = await api('/ht/driver-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...localJob, date: localDate }),
        });
        const liveResult = await liveResp.json().catch(() => ({}));
        if (!liveResp.ok || !liveResult.ok) {
          throw new Error(liveResult.message || liveResult.error || `HTTP ${liveResp.status}`);
        }
        haultechWriteState = 'written';
        confirmedJobId = liveResult.jobId || liveResult.ref || localJob.id;
        haultechReason = liveResult.alreadyPresent
          ? 'Already present in Haultech; not duplicated'
          : DRIVER_ADDED_LIVE_REASON;
      } catch (writeErr) {
        haultechWriteState = 'saved locally';
        haultechReason = `${DRIVER_ADDED_BACKUP_REASON}: ${writeErr.message || 'Haultech write failed'}`;
      }
    }
    queueTrialEvent('day_sheet_row_added', localJob, {
	      customer: localJob.customer,
	      addedBy: localJob.addedBy,
	      vehicle: localJob.vehicle,
      material,
      concreteType: localJob.concreteType,
      from,
      to,
      quantity: weight,
      unit,
      price: localJob.price,
      priceMode: localJob.priceMode,
      priceInput: localJob.priceInput,
      reference: ref,
      notes,
      a1PaymentStatus,
      paymentStatus: a1PaymentStatus,
      wtn,
      wasteTransferNote: wtn,
      hasSignature: fSigCanvas && fSigCtx && !isBlankCanvas(fSigCanvas),
      hasPhoto: !!fPhotoFile,
      state: haultechWriteState,
      haultechWriteState,
      reason: haultechReason,
    });
    allJobs.push({
	      jobId: confirmedJobId, _cached: true, _driverAdded: true,
	      _driver: localJob.driver, _customer: localJob.customer,
	      _addedBy: localJob.addedBy,
      _material: localJob.material, _from: localJob.from, _to: localJob.to,
      _concreteType: localJob.concreteType,
      _vehicle: localJob.vehicle,
      _quantity: localJob.quantity, _price: localJob.price, _status: localJob.status,
      _priceMode: localJob.priceMode,
      _priceInput: localJob.priceInput,
      _unit: localJob.unit,
      _reference: localJob.reference,
      _notes: localJob.notes,
      _a1PaymentStatus: localJob.a1PaymentStatus,
      _paymentStatus: localJob.paymentStatus,
      _wtn: localJob.wtn,
      _ewcCode: localJob.ewcCode,
      _sicCode: localJob.sicCode,
      _containment: localJob.containment,
      savedAt: localJob.savedAt,
    });
    $('add-job-modal').classList.add('hidden');
    $('add-job-form').reset();
    $('f-customer-id').value = '';
    updateA1PaymentFields();
    updateWasteFieldsVisibility();
    if (fSigCtx) fSigCtx.clearRect(0,0,fSigCanvas.width,fSigCanvas.height);
    fPhotoFile = null;
    showJobConfirmation({
      customer: localJob.customer,
      vehicle: localJob.vehicle,
      material,
      from: from || 'PMG Yard',
      to,
      weight: `${weight}${unit}`,
      ref: ref || confirmedJobId,
      paymentStatus: a1PaymentStatus,
    });
    renderJobs();
    toast(haultechWriteState === 'written' ? 'Row saved to Haultech' : 'Row saved locally - Haultech retry queued');
  } catch (e) {
    toast('Failed to save row: ' + (e.message || 'Unknown error'));
  } finally {
    btn.disabled = false; btn.textContent = 'Save row';
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// PROBLEM / FEEDBACK TRIAL CAPTURE
// ══════════════════════════════════════════════════════════════════════════════

function showProblemModal(job) {
  if (isTerminalJobStatus(getJobStatus(job))) {
    toast('Job already closed');
    return;
  }
  activeJob = job;
  selectedProblemReason = '';
  $('problem-note').value = '';
  $('problem-photo').value = '';
  $('problem-reasons').querySelectorAll('button').forEach(btn => btn.style.borderColor = 'var(--border)');
  $('problem-modal').classList.remove('hidden');
}

$('problem-close').addEventListener('click', () => $('problem-modal').classList.add('hidden'));
$('problem-modal').addEventListener('click', e => {
  if (e.target === $('problem-modal')) $('problem-modal').classList.add('hidden');
});
$('problem-reasons').addEventListener('click', e => {
  const btn = e.target.closest('button[data-reason]');
  if (!btn) return;
  selectedProblemReason = btn.dataset.reason;
  $('problem-reasons').querySelectorAll('button').forEach(b => b.style.borderColor = 'var(--border)');
  btn.style.borderColor = 'var(--primary)';
});
$('problem-submit').addEventListener('click', async () => {
  if (!activeJob) return;
  if (isTerminalJobStatus(getJobStatus(activeJob))) {
    $('problem-modal').classList.add('hidden');
    toast('Job already closed');
    return;
  }
  const ok = window.confirm('Cancel this job? Only press Yes if it was not done today.');
  if (!ok) return;
  const reason = selectedProblemReason || 'Other';
  const note = $('problem-note').value.trim();
  const haultechNote = composeDriverHaultechNote({ reason, note });
  const photo = $('problem-photo').files[0] || null;
  const event = queueTrialEvent('job_cancelled', activeJob, {
    reason,
    note,
    hasPhoto: !!photo,
    state: 'saved locally',
    haultechWriteState: 'saved locally',
  });
  if (photo) {
    try {
      const body = await photo.arrayBuffer();
      await fetch(WORKER_URL + `/photos/problem-${event.eventId}`, {
        method: 'PUT',
        headers: { 'X-PMG-Key': API_KEY },
        body,
      });
    } catch {}
  }
  updateJobStatusLocal(activeJob, 'cancelled');
  try {
    if (haultechNote) await writeHaultechDriverNoteForJob(activeJob, haultechNote);
  } catch (e) {
    setQueueState(event.eventId, 'failed', e.message || 'Haultech note write failed; local cancellation still saved on this phone');
  }
  try {
    await api(`/job-status/${activeJob.id || activeJob.jobId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'cancelled', reason, note, driver: currentUser.name, date: todayISO() }),
    });
  } catch {}
  $('problem-modal').classList.add('hidden');
  toast('Job cancelled');
  showJobList();
  renderJobs();
});

function initPlaceChips() {
  document.querySelectorAll('.place-chips').forEach(wrap => {
    const target = wrap.dataset.target;
    wrap.innerHTML = COMMON_PLACES.slice(0, 4).map(place => `<button type="button" class="place-chip" data-place="${esc(place)}">${esc(place.split(',')[0])}</button>`).join('');
    wrap.querySelectorAll('.place-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const key = addressKeyForField(target);
        const saved = SAVED_ADDRESSES.find(item => item.searchText.toLowerCase().includes(chip.dataset.place.toLowerCase()));
        if (saved) selectStructuredAddress(key, saved.address);
        else {
          $(target).value = chip.dataset.place;
          clearSelectedAddress(key);
        }
      });
    });
  });
}

$('feedback-btn').addEventListener('click', () => {
  selectedFeedbackTags = [];
  $('feedback-text').value = '';
  $('feedback-tags').querySelectorAll('button').forEach(btn => btn.style.borderColor = 'var(--border)');
  $('feedback-modal').classList.remove('hidden');
});
$('feedback-close').addEventListener('click', () => $('feedback-modal').classList.add('hidden'));
$('feedback-modal').addEventListener('click', e => {
  if (e.target === $('feedback-modal')) $('feedback-modal').classList.add('hidden');
});
$('feedback-tags').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tag]');
  if (!btn) return;
  const tag = btn.dataset.tag;
  if (selectedFeedbackTags.includes(tag)) {
    selectedFeedbackTags = selectedFeedbackTags.filter(t => t !== tag);
    btn.style.borderColor = 'var(--border)';
  } else {
    selectedFeedbackTags.push(tag);
    btn.style.borderColor = 'var(--primary)';
  }
});
$('feedback-submit').addEventListener('click', () => {
  const text = $('feedback-text').value.trim();
  if (!text && selectedFeedbackTags.length === 0) { toast('Add a note or tap a tag'); return; }
  queueTrialEvent(`${currentUser.username}_feedback`, { id: 'feedback', jobId: 'feedback' }, {
    tags: selectedFeedbackTags,
    text,
    diagnostics: {
      appBuildId: APP_BUILD_ID,
      route: window.location.pathname,
      screen: currentScreen,
      online: navigator.onLine,
      phone: navigator.userAgent,
      selectedVehicle: getSelectedDriverVehicle(),
      lastJobsUpdatedAt: lastJobsUpdatedAt?.toISOString() || '',
      queueCounts: queueCounts(),
      pendingWalkaroundTickets: getPendingWalkaroundTickets().length,
      capturedAt: new Date().toISOString(),
    },
    state: 'written',
    haultechWriteState: 'written',
  });
  $('feedback-modal').classList.add('hidden');
  toast('Feedback saved');
});

// ══════════════════════════════════════════════════════════════════════════════
// TOOLBAR
// ══════════════════════════════════════════════════════════════════════════════

$('refresh-btn').addEventListener('click', () => { loadJobs({ force: true }); toast('Refreshing…'); });

// ══════════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════════

function showJobConfirmation(job) {
  const displayWeight = (() => {
    const value = String(job.weight || '').trim();
    if (!value) return '—';
    if (/[a-z]$/i.test(value)) return value;
    return `${value}${job.unit || 't'}`;
  })();
  const details = [
    `👤 Customer: <strong>${esc(job.customer || '—')}</strong>`,
    `🚛 Truck / wagon: <strong>${esc(job.vehicle || '—')}</strong>`,
    `🚚 Material: <strong>${esc(job.material || '—')}</strong>`,
    `📍 From: <strong>${esc(job.from || '—')}</strong>`,
    `🏠 To: <strong>${esc(job.to || '—')}</strong>`,
    `⚖️ Weight: <strong>${esc(displayWeight)}</strong>`,
    `🏷️ Ref: <strong>${esc(job.ref || '—')}</strong>`,
    job.paymentStatus ? `💷 Payment: <strong>${esc(job.paymentStatus === 'paid' ? 'Paid' : 'Not paid')}</strong>` : '',
  ].filter(Boolean).join('<br>');
  $('job-confirm-details').innerHTML = details;
  $('job-confirm-modal').classList.remove('hidden');
}

function init() {
  renderUserButtons();
  initPlaceChips();
  initAddressAutocomplete();
  setHeaderForLogin();
  recordCurrentAppBuild();
  scheduleWalkaroundActivationRefresh();
  scheduleAppAutoUpdateChecks();

  // Sync retry button
  $('sync-retry-btn').addEventListener('click', () => {
    const moved = markDriverFailedWritebacksSavedLocally();
    flushRetryQueue();
    updateSyncUI();
    toast(moved ? 'Saved-local queue tidied' : 'Retrying sync');
  });

  // Flush retry queue on load + every 30 seconds
  flushRetryQueue();
  setInterval(flushRetryQueue, 30000);
  flushWalkaroundTicketQueue({ silent: true });
  setInterval(() => flushWalkaroundTicketQueue({ silent: true }), 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && currentScreen === 'jobs') loadJobs({ force: true }).catch(() => {});
  });

  // Reflect initial sync state
  updateSyncUI();

  const params = new URLSearchParams(window.location.search);
  const pathParts = window.location.pathname.toLowerCase().split('/').filter(Boolean);
  const pathDriver = pathParts.find((part) => INCAB_USERS[part]) || '';
  const requestedDriver = (params.get('driver') || pathDriver || '').toLowerCase();
  if (requestedDriver && INCAB_USERS[requestedDriver]) {
    trialMode = true;
    currentUser = { username: requestedDriver, ...INCAB_USERS[requestedDriver] };
    localStorage.setItem('pmg-user', requestedDriver);
    enterJobsScreen();
    resumeWalkaroundDraftAfterEnter();
    toast(`${INCAB_USERS[requestedDriver].name} driver mode`);
    return;
  }

  const savedUser = localStorage.getItem('pmg-user');
  if (savedUser && INCAB_USERS[savedUser]) {
    currentUser = { username: savedUser, ...INCAB_USERS[savedUser] };
    enterJobsScreen();
    resumeWalkaroundDraftAfterEnter();
    toast(`${INCAB_USERS[savedUser].name} driver mode`);
  }
}

init();

function recordCurrentAppBuild() {
  try {
    localStorage.setItem('pmg-driver-current-build', APP_BUILD_ID);
    sessionStorage.removeItem('pmg-driver-update-attempt-stale');
  } catch {}
}

function shouldAttemptBuildReload(latestBuildId) {
  try {
    const raw = sessionStorage.getItem('pmg-driver-update-attempt');
    const parsed = raw ? JSON.parse(raw) : null;
    if (parsed?.buildId === latestBuildId && Date.now() - Number(parsed.at || 0) < 2 * 60 * 1000) {
      return false;
    }
    sessionStorage.setItem('pmg-driver-update-attempt', JSON.stringify({ buildId: latestBuildId, at: Date.now() }));
  } catch {}
  return true;
}

function requestSafeAppReload(reason = 'update') {
  if (hasUnsafeUpdateReloadState()) {
    pendingAppVersionReload = true;
    toast('Update ready - finish the open job/form first');
    return;
  }
  toast(reason === 'walkaround_activation' ? 'Updating driver app...' : 'App update ready - refreshing');
  window.location.reload();
}

function resumeWalkaroundDraftAfterEnter() {
  try {
    const draft = JSON.parse(localStorage.getItem(WALKAROUND_DRAFT_KEY) || 'null');
    if (!draft?.active || draft.date !== todayISO() || draft.driverId !== (currentUser?.driverId || '')) return;
    if (draft.vehicle) setSelectedDriverVehicle(draft.vehicle);
    if (draft.trailer !== undefined) setSelectedDriverTrailer(draft.trailer || '');
    setTimeout(() => showWalkaroundScreen(), 350);
  } catch {}
}

async function checkForAppVersionUpdate(reason = 'timer') {
  const resp = await fetch(`${APP_VERSION_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if (!resp.ok) return;
  const version = await resp.json();
  const latestBuildId = String(version?.buildId || '').trim();
  if (!latestBuildId) return;
  if (latestBuildId === APP_BUILD_ID) {
    try {
      localStorage.setItem('pmg-driver-current-build', APP_BUILD_ID);
      sessionStorage.removeItem('pmg-driver-update-attempt');
    } catch {}
    return;
  }
  if (!shouldAttemptBuildReload(latestBuildId)) return;
  requestSafeAppReload(reason);
}

function scheduleAppAutoUpdateChecks() {
  checkForAppVersionUpdate('initial').catch(() => {});
  setInterval(() => checkForAppVersionUpdate('timer').catch(() => {}), APP_UPDATE_CHECK_MS);
  setInterval(reloadForPendingServiceWorkerUpdate, 5000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForAppVersionUpdate('visible').catch(() => {});
  });
}

if ('serviceWorker' in navigator) {
  let refreshingForUpdate = false;
  const handleServiceWorkerUpdate = () => {
    if (refreshingForUpdate) return;
    if (hasUnsafeUpdateReloadState()) {
      pendingServiceWorkerReload = true;
      toast('Update ready - finish the open job/form first');
      return;
    }
    refreshingForUpdate = true;
    window.location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data?.type === 'PMG_SW_UPDATED') handleServiceWorkerUpdate();
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    handleServiceWorkerUpdate();
  });
  navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
    reg.update().catch(() => {});
    setInterval(() => reg.update().catch(() => {}), APP_UPDATE_CHECK_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update().catch(() => {});
    });
  }).catch(() => {});
}
</script>
