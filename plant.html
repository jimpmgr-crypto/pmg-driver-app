      }
      const asset = record.asset;
      els.recordDetail.innerHTML = `
        <div class="record-head">
          <div>
            <h2>${escapeHtml(asset.displayName || asset.id)}</h2>
            <p>${escapeHtml(asset.machineType || 'Machine type not set')}</p>
          </div>
          <div class="record-actions">
            <span class="chip ${escapeHtml(asset.dueStatus || 'unknown')}">${escapeHtml(asset.dueLabel || 'Needs setup')}</span>
            <button type="button" class="print-btn" onclick="window.print()">Print plant sheet</button>
          </div>
        </div>
        <div class="identity-grid">
          ${identityCell('Group', plantGroupLabel(asset))}
          ${identityCell('Plant no.', asset.plantNumber || '-')}
          ${isVehicleAsset(asset) ? identityCell('Reg', asset.registration || asset.plantNumber || '-') : ''}
          ${identityCell('Serial', asset.serialNumber || '-')}
          ${identityCell('Year', asset.year || '-')}
          ${identityCell('Location', asset.site || '-')}
          ${identityCell('Last service', formatDate(asset.lastServiceDate) || '-')}
          ${identityCell(`Last ${usageLabel(asset).toLowerCase()}`, isVehicleAsset(asset) ? (asset.lastServiceMileage || asset.lastKnownMileage || '-') : (asset.lastServiceHours || asset.lastKnownHours || '-'))}
          ${identityCell('Next service due', nextDueText(asset))}
          ${identityCell('Evidence', asset.sharePointEvidencePath || '-', 'evidence-cell')}
        </div>
        ${asset.scheduleNotes?.length ? `<div class="section"><div class="empty">${escapeHtml(asset.scheduleNotes.join('; '))}</div></div>` : ''}
        <div class="section">
          <div class="section-title"><h3>Service History</h3><span class="muted">${record.history.length} rows</span></div>
          ${renderHistory(record.history)}
        </div>
        <div class="section">
          <div class="section-title"><h3>Filters And Parts</h3><span class="muted">${record.filterParts.length} rows</span></div>
          ${renderFilters(record.filterParts)}
        </div>
      `;
    }

    function renderIdentityForm() {
      if (!els.identityForm) return;
      const asset = state.record?.asset;
      const fields = els.identityForm.elements;
      Array.from(fields).forEach(field => { field.disabled = !asset; });
      if (!asset) {
        els.identityForm.reset();
        return;
      }
      fields.namedItem('displayName').value = asset.displayName || '';
      fields.namedItem('plantNumber').value = asset.plantNumber || '';
      fields.namedItem('registration').value = asset.registration || '';
      fields.namedItem('machineType').value = asset.machineType || '';
      fields.namedItem('serialNumber').value = asset.serialNumber || '';
      fields.namedItem('year').value = asset.year || '';
      fields.namedItem('site').value = asset.site || '';
    }

    function renderSelectedServiceAsset() {
      if (!els.selectedServiceAsset) return;
      const asset = state.record?.asset;
      if (!asset) {
        els.selectedServiceAsset.innerHTML = '<span>Selected plant</span>Select a plant item';
        return;
      }
      const meta = [asset.machineType, asset.site ? `Location ${asset.site}` : '', asset.serialNumber ? `Serial ${asset.serialNumber}` : ''].filter(Boolean).join(' | ');
      els.selectedServiceAsset.innerHTML = `<span>Selected plant</span>${escapeHtml(asset.displayName || asset.id)}${meta ? `<small>${escapeHtml(meta)}</small>` : ''}`;
    }

    function identityCell(label, value, extraClass = '') {
      return `<div class="identity-cell ${escapeHtml(extraClass)}"><span>${escapeHtml(label)}</span><b>${escapeHtml(value)}</b></div>`;
    }

    function historyTypeLabel(event) {
      if ((event.category || '').toLowerCase() === 'invoice') return 'Parts / work';
      return titleCase(event.category || 'note');
    }

    function historyDetailText(event) {
      const bits = [];
      if (event.sourceName) bits.push(event.sourceName);
      const work = event.description || event.anomalies || event.serviceType || '';
      if (work) bits.push(work);
      if (event.torqueCheckRequired) bits.push(`Wheel torque re-check ${event.torqueNm || 625} Nm`);
      if (event.invoiceNumber) bits.push(`Ref ${event.invoiceNumber}`);
      return bits.join(' - ') || '-';
    }

    function eventReadingText(event) {
      if (event.mileage || event.odometer) return `${event.mileage || event.odometer} miles`;
      if (event.hours) return `${event.hours} hours`;
      return '-';
    }

    function renderHistory(history) {
      if (!history.length) return '<div class="empty">No history rows yet.</div>';
      const showAdmin = false;
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Reading</th>
                <th>Details</th>
                ${showAdmin ? '<th>Source</th><th>Cost</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${history.slice(0, 80).map(event => `
                <tr>
                  <td>${escapeHtml(formatDate(event.date) || '-')}</td>
                  <td>${escapeHtml(historyTypeLabel(event))}</td>
                  <td>${escapeHtml(eventReadingText(event))}</td>
                  <td>${escapeHtml(historyDetailText(event))}</td>
                  ${showAdmin ? `<td>${escapeHtml(event.sourceName || event.origin || '-')}</td><td>${escapeHtml(formatMoney(event.amount) || event.invoiceNumber || '-')}</td>` : ''}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function publicPartText(value) {
      const parts = String(value || '').split('|').map(part => part.trim()).filter(Boolean);
      const visible = parts.filter(part => !/£|^-?\d+\.\d{1,2}$/.test(part.replace(/,/g, '')));
      return (visible.length ? visible : parts).join(' | ') || '-';
    }

    function renderFilters(parts) {
      if (!parts.length) return '<div class="empty">No filter rows yet.</div>';
      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Code</th><th>Notes</th></tr></thead>
            <tbody>
              ${parts.map(part => `
                <tr>
                  <td>${escapeHtml(part.type || '-')}</td>
                  <td>${escapeHtml(publicPartText(part.code))}</td>
                  <td>${escapeHtml(publicPartText(part.notes))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderChecksheet() {
      els.checksheet.innerHTML = CHECK_ITEMS.map(item => `
        <label class="check-row">
          <span>${escapeHtml(item)}</span>
          <select name="check:${escapeHtml(item)}">
            <option>Good</option>
            <option>Done</option>
            <option>Monitor</option>
            <option>N/A</option>
          </select>
        </label>
      `).join('');
    }

    function addFilterEditRow(type = '', code = '') {
      const row = document.createElement('div');
      row.className = 'filter-edit-row';
      row.innerHTML = `
        <input name="filterType" placeholder="Type" value="${escapeHtml(type)}">
        <input name="filterCode" placeholder="Code" value="${escapeHtml(code)}">
        <button type="button" class="icon-btn" title="Remove row">x</button>
      `;
      row.querySelector('button').addEventListener('click', () => row.remove());
      els.filterEditList.appendChild(row);
    }

    function serviceField(name) {
      return els.serviceForm.elements.namedItem(name);
    }

    function selectedServiceAsset() {
      return state.record?.asset || state.assets.find(item => item.id === state.selectedId) || null;
    }

    function defaultIntervalForAsset(asset) {
      return isVehicleAsset(asset) ? DEFAULT_VEHICLE_SERVICE_INTERVAL_MILES : DEFAULT_SERVICE_INTERVAL_HOURS;
    }

    function setIntervalOptionsForAsset(asset) {
      const select = serviceField('nextServiceIntervalHours');
      const current = select.value;
      const options = isVehicleAsset(asset)
        ? [
            ['10000', '10,000 miles'],
            ['6000', '6,000 miles'],
            ['12000', '12,000 miles'],
            ['15000', '15,000 miles'],
            ['20000', '20,000 miles']
          ]
        : [
            ['500', '500 hours'],
            ['250', '250 hours'],
            ['750', '750 hours'],
            ['1000', '1000 hours']
          ];
      select.innerHTML = options.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
      select.value = options.some(([value]) => value === current) ? current : String(defaultIntervalForAsset(asset));
    }

    function updateUsageModeForAsset(asset = selectedServiceAsset()) {
      const vehicle = isVehicleAsset(asset);
      setIntervalOptionsForAsset(asset);
      if (els.usageReadingLabel) els.usageReadingLabel.textContent = vehicle ? 'Current mileage / odometer' : 'Current hours at service';
      if (els.usageReadingHint) els.usageReadingHint.textContent = vehicle ? 'Used for the 10,000-mile service reminder.' : 'Used for the 500-hour reminder.';
      if (els.serviceIntervalLabel) els.serviceIntervalLabel.textContent = vehicle ? 'Mileage interval' : 'Hour interval';
      if (els.serviceIntervalHint) els.serviceIntervalHint.textContent = vehicle
        ? 'Default rule: 12 months or 10,000 miles, whichever comes first.'
        : 'Default rule: 12 months or 500 hours, whichever comes first.';
      if (els.nextUsageReadingLabel) els.nextUsageReadingLabel.textContent = vehicle ? 'Next due mileage' : 'Next due hours';
      if (els.nextUsageReadingHint) els.nextUsageReadingHint.textContent = vehicle ? 'Auto-fills from current mileage + interval.' : 'Auto-fills from current hours + interval.';
      serviceField('hours').placeholder = vehicle ? 'e.g. 74200' : 'e.g. 3480';
    }

    function isScheduleReviewType(type) {
      return String(type || '').toLowerCase().includes('schedule review');
    }

    function serviceTypeNeedsTorque(type) {
      const lower = String(type || '').toLowerCase();
      return lower.includes('torque') || lower.includes('wheel off');
    }

    function serviceTypeAllowsHourSchedule(type) {
      return categoryForServiceType(type) === 'service' || isScheduleReviewType(type);
    }

    function eventHasScheduleUpdate(event) {
      return Boolean(event?.nextDueDate)
        || (event?.nextDueHours !== null && event?.nextDueHours !== undefined && event?.nextDueHours !== '');
    }

    function updateNextDueDateFromServiceDate(force = false) {
      const nextDueDate = serviceField('nextDueDate');
      if (categoryForServiceType(serviceField('serviceType').value) !== 'service') {
        if (nextDueDate.dataset.auto !== 'false') nextDueDate.value = '';
        return;
      }
      const dueDate = addCalendarMonths(serviceField('date').value, SERVICE_INTERVAL_MONTHS);
      if (!dueDate) return;
      if (force || nextDueDate.dataset.auto !== 'false' || !nextDueDate.value.trim()) {
        nextDueDate.value = dueDate;
        nextDueDate.dataset.auto = 'true';
      }
    }

    function updateNextDueHoursFromInterval(force = false) {
      if (!serviceTypeAllowsHourSchedule(serviceField('serviceType').value)) return;
      const hours = Number(serviceField('hours').value);
      const interval = Number(serviceField('nextServiceIntervalHours').value || defaultIntervalForAsset(selectedServiceAsset()));
      const nextDueHours = serviceField('nextDueHours');
      if (!Number.isFinite(hours) || hours < 0 || !Number.isFinite(interval) || interval <= 0) return;
      if (force || nextDueHours.dataset.auto !== 'false' || !nextDueHours.value.trim()) {
        nextDueHours.value = String(Math.round(hours + interval));
        nextDueHours.dataset.auto = 'true';
      }
    }

    function intervalFromServiceType(serviceType) {
      const match = String(serviceType || '').match(/\b(250|500|750|1000)\b/);
      const asset = selectedServiceAsset();
      if (!isVehicleAsset(asset) && match) return Number(match[1]);
      if (isScheduleReviewType(serviceType)) return defaultIntervalForAsset(asset);
      return categoryForServiceType(serviceType) === 'service' ? defaultIntervalForAsset(asset) : null;
    }

    async function saveServiceEntry(event) {
      event.preventDefault();
      if (!state.selectedId) return toast('Select a plant item first.');
      if (!state.workerOnline) return toast('Worker is not available. Entry not saved.');
      const form = new FormData(els.serviceForm);
      const serviceType = String(form.get('serviceType') || '');
      const asset = selectedServiceAsset() || state.assets.find(item => item.id === state.selectedId) || {};
      const vehicleMode = isVehicleAsset(asset);
      const reading = String(form.get('hours') || '').trim();
      const torqueCheckRequired = serviceTypeNeedsTorque(serviceType);
      const category = categoryForServiceType(serviceType);
      if (category === 'service' && !reading) {
        const ok = window.confirm(vehicleMode
          ? 'No current mileage entered. Save date-only service and skip the 10,000-mile reminder for this entry?'
          : 'No current hours entered. Save date-only service and skip the 500-hour reminder for this entry?');
        if (!ok) return;
      }
      const payload = {
        assetId: state.selectedId,
        plantNumber: asset.plantNumber || '',
        registration: asset.registration || '',
        assetType: vehicleMode ? 'vehicle' : (asset.assetType || ''),
        date: form.get('date'),
        hours: vehicleMode ? '' : reading,
        mileage: vehicleMode ? reading : '',
        serviceType,
        category,
        torqueCheckRequired,
        torqueNm: torqueCheckRequired ? (form.get('torqueNm') || '625') : '',
        workDone: form.get('workDone'),
        anomalies: form.get('anomalies'),
        nextDueDate: form.get('nextDueDate'),
        nextDueDateBasis: serviceField('nextDueDate').dataset.auto === 'true' ? '12_month_service_rule' : 'manual',
        nextDueHours: vehicleMode ? '' : form.get('nextDueHours'),
        nextServiceIntervalHours: vehicleMode ? '' : form.get('nextServiceIntervalHours'),
        nextDueMileage: vehicleMode ? form.get('nextDueHours') : '',
        nextServiceIntervalMiles: vehicleMode ? form.get('nextServiceIntervalHours') : '',
        createdBy: form.get('createdBy') || 'Tony',
        sharePointEvidencePath: asset.sharePointEvidencePath || '',
        checklist: CHECK_ITEMS.map(item => ({ item, status: form.get(`check:${item}`) || 'Good' })),
        filterParts: collectFilterRows()
      };
      try {
        const result = await api('/plant/service-events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!result?.event?.id) {
          throw new Error('Entry was not confirmed by the server. Please try again before leaving this page.');
        }
        appendLocalEvent(result.event);
        serviceField('workDone').value = '';
        serviceField('anomalies').value = '';
        serviceField('hours').value = '';
        serviceField('serviceType').value = 'Full service';
        serviceField('torqueNm').value = '625';
        serviceField('nextDueDate').dataset.auto = 'true';
        updateUsageModeForAsset(selectedServiceAsset());
        serviceField('nextServiceIntervalHours').value = String(defaultIntervalForAsset(selectedServiceAsset()));
        serviceField('nextDueHours').value = '';
        serviceField('nextDueHours').dataset.auto = 'true';
        updateNextDueDateFromServiceDate(true);
        els.filterEditList.innerHTML = '';
        addFilterEditRow();
        await loadRecord(state.selectedId);
        renderAll();
        toast('Entry saved and synced.');
      } catch (error) {
        toast(error.message);
      }
    }

    async function saveAsset(event) {
      event.preventDefault();
      if (!state.workerOnline) return toast('Worker is not available. Item not saved.');
      const form = new FormData(els.assetForm);
      const payload = {
        plantNumber: form.get('plantNumber'),
        registration: form.get('registration'),
        assetType: form.get('registration') ? 'vehicle' : '',
        machineType: form.get('machineType'),
        serialNumber: form.get('serialNumber'),
        year: form.get('year'),
        site: form.get('site'),
        createdBy: 'Tony'
      };
      try {
        const result = await api('/plant/assets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        els.assetForm.reset();
        state.selectedId = result.asset.id;
        await loadData();
        toast('Plant item saved.');
      } catch (error) {
        toast(error.message);
      }
    }

    async function saveIdentity(event) {
      event.preventDefault();
      if (!state.selectedId || !state.record?.asset) return toast('Select a plant item first.');
      if (!state.workerOnline) return toast('Worker is not available. Details not saved.');
      const form = new FormData(els.identityForm);
      const payload = {
        displayName: form.get('displayName'),
        plantNumber: form.get('plantNumber'),
        registration: form.get('registration'),
        assetType: form.get('registration') ? 'vehicle' : (state.record.asset.assetType || ''),
        machineType: form.get('machineType'),
        serialNumber: form.get('serialNumber'),
        year: form.get('year'),
        site: form.get('site'),
        sharePointEvidencePath: state.record.asset.sharePointEvidencePath || '',
        updatedBy: 'Tony'
      };
      try {
      const result = await api(`/plant/assets/${encodeURIComponent(state.selectedId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const current = state.assets.find(asset => asset.id === state.selectedId) || {};
        const merged = { ...current, ...(result.asset || payload), id: state.selectedId };
        const due = dueStatus(merged);
        Object.assign(merged, { dueStatus: due.state, dueLabel: due.label, dueMeta: due, plantGroup: plantGroupKey(merged), plantGroupLabel: plantGroupLabel(merged) });
        state.assets = state.assets.map(asset => asset.id === state.selectedId ? merged : asset);
        state.record = { ...(state.record || {}), asset: merged };
        renderAll();
        toast('Plant details saved.');
      } catch (error) {
        toast(error.message);
      }
    }

    function collectFilterRows() {
      return Array.from(els.filterEditList.querySelectorAll('.filter-edit-row')).map(row => {
        const inputs = row.querySelectorAll('input');
        return { type: inputs[0].value.trim(), code: inputs[1].value.trim() };
      }).filter(part => part.type || part.code);
    }

    function appendLocalEvent(event) {
      if (!event) return;
      state.historyByAsset[event.assetId] = state.historyByAsset[event.assetId] || [];
      state.historyByAsset[event.assetId].unshift(event);
      if (event.filterParts?.length) {
        state.filterParts[event.assetId] = [...(state.filterParts[event.assetId] || []), ...event.filterParts];
      }
      const asset = state.assets.find(item => item.id === event.assetId);
      if (asset) {
        asset.historyCount = (asset.historyCount || 0) + 1;
        asset.latestMechanicEntryAt = latestTimestamp(asset.latestMechanicEntryAt, activityAt(event));
        asset.lastWorkedAt = latestTimestamp(asset.lastWorkedAt, activityAt(event));
        if (event.hours) asset.lastKnownHours = Math.max(asset.lastKnownHours || 0, event.hours);
        if (event.mileage || event.odometer) asset.lastKnownMileage = Math.max(asset.lastKnownMileage || 0, event.mileage || event.odometer);
        if (event.category === 'service') {
          asset.lastServiceDate = event.date;
          if (event.hours) asset.lastServiceHours = event.hours;
          if (event.mileage || event.odometer) asset.lastServiceMileage = event.mileage || event.odometer;
        }
        if (event.category === 'inspection') {
          asset.lastInspectionDate = event.date;
        }
        if (event.category === 'service' || eventHasScheduleUpdate(event)) {
          if (event.nextDueDate) {
            asset.nextServiceDueDate = event.nextDueDate;
            asset.nextServiceDueBasis = event.category === 'service'
              ? (event.nextDueDateBasis || 'manual')
              : (event.nextDueDateBasis === '12_month_service_rule' ? 'manual_schedule_review' : (event.nextDueDateBasis || 'manual_schedule_review'));
          }
          if (event.nextDueHours !== null && event.nextDueHours !== undefined && event.nextDueHours !== '') {
            asset.nextServiceDueHours = event.nextDueHours;
          } else if (event.category === 'service') {
            delete asset.nextServiceDueHours;
          }
          if (event.nextDueMileage !== null && event.nextDueMileage !== undefined && event.nextDueMileage !== '') {
            asset.nextServiceDueMileage = event.nextDueMileage;
          } else if (event.category === 'service') {
            delete asset.nextServiceDueMileage;
          }
          if (event.category !== 'service' && eventHasScheduleUpdate(event)) {
            asset.lastServiceScheduleReviewDate = event.date;
            asset.lastServiceScheduleReviewType = event.serviceType || event.category;
          }
          const due = dueStatus(asset);
          asset.dueStatus = due.state;
          asset.dueLabel = due.label;
          asset.dueMeta = due;
        }
      }
    }

    function groupByAsset(items) {
      return (items || []).reduce((acc, item) => {
        if (!item.assetId) return acc;
        acc[item.assetId] = acc[item.assetId] || [];
        acc[item.assetId].push(item);
        return acc;
      }, {});
    }

    function dueStatus(asset) {
      const today = new Date().toISOString().slice(0, 10);
      const candidates = [hoursDueStatus(asset), mileageDueStatus(asset), dateDueStatus(asset, today)].filter(Boolean);
      if (candidates.length) return candidates.sort(compareDueCandidates)[0];
      if (asset.lastInspectionDate) return { state: 'watch', label: 'No service date' };
      return { state: 'unknown', label: 'Needs setup' };
    }

    function dateDueStatus(asset, today) {
      const info = serviceDueDateInfo(asset);
      if (!info.date) return null;
      const days = Math.round((Date.parse(`${info.date}T00:00:00Z`) - Date.parse(`${today}T00:00:00Z`)) / 86400000);
      const labelPrefix = info.basis === '12_month_service_rule' ? '12-month' : 'Date';
      if (days < 0) return { state: 'overdue', label: `${labelPrefix} due`, days, dueDate: info.date, dueBasis: info.basis, dueType: 'date' };
      if (days <= SERVICE_DUE_SOON_DAYS) return { state: 'due-soon', label: `${labelPrefix} soon`, days, dueDate: info.date, dueBasis: info.basis, dueType: 'date' };
      return { state: 'scheduled', label: `${labelPrefix} set`, days, dueDate: info.date, dueBasis: info.basis, dueType: 'date' };
    }

    function hoursDueStatus(asset) {
      if (asset.nextServiceDueHours && asset.lastKnownHours) {
        const hoursRemaining = asset.nextServiceDueHours - asset.lastKnownHours;
        if (hoursRemaining <= 0) return { state: 'overdue', label: 'Hours due', hoursRemaining, dueType: 'hours' };
        if (hoursRemaining <= SERVICE_DUE_SOON_HOURS) return { state: 'due-soon', label: 'Hours soon', hoursRemaining, dueType: 'hours' };
        return { state: 'scheduled', label: 'Hours set', hoursRemaining, dueType: 'hours' };
      }
      return null;
    }

    function mileageDueStatus(asset) {
      if (asset.nextServiceDueMileage && asset.lastKnownMileage) {
        const mileageRemaining = asset.nextServiceDueMileage - asset.lastKnownMileage;
        if (mileageRemaining <= 0) return { state: 'overdue', label: 'Mileage due', mileageRemaining, dueType: 'mileage' };
        if (mileageRemaining <= SERVICE_DUE_SOON_MILES) return { state: 'due-soon', label: 'Mileage soon', mileageRemaining, dueType: 'mileage' };
        return { state: 'scheduled', label: 'Mileage set', mileageRemaining, dueType: 'mileage' };
      }
      return null;
    }

    function compareDueCandidates(a, b) {
      const order = { overdue: 0, 'due-soon': 1, scheduled: 2 };
      const stateDiff = (order[a.state] ?? 9) - (order[b.state] ?? 9);
      if (stateDiff) return stateDiff;
      if (a.dueType === 'date' && b.dueType === 'date') return a.days - b.days;
      if (a.dueType === 'hours' && b.dueType === 'hours') return a.hoursRemaining - b.hoursRemaining;
      if (a.dueType === 'mileage' && b.dueType === 'mileage') return a.mileageRemaining - b.mileageRemaining;
      if (a.state === 'scheduled') return a.dueType === 'date' ? -1 : 1;
      return ['hours', 'mileage'].includes(a.dueType) ? -1 : 1;
    }

    function serviceDueDateInfo(asset) {
      if (asset.nextServiceDueDate) {
        return {
          date: asset.nextServiceDueDate,
          basis: asset.nextServiceDueBasis || 'manual'
        };
      }
      const date = addCalendarMonths(asset.lastServiceDate, SERVICE_INTERVAL_MONTHS);
      return date ? { date, basis: '12_month_service_rule' } : { date: '', basis: '' };
    }

    function addCalendarMonths(value, months) {
      const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return '';
      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      const day = Number(match[3]);
      const targetMonthIndex = monthIndex + months;
      const targetYear = year + Math.floor(targetMonthIndex / 12);
      const targetMonth = ((targetMonthIndex % 12) + 12) % 12;
      const lastDay = new Date(Date.UTC(targetYear, targetMonth + 1, 0)).getUTCDate();
      const targetDay = Math.min(day, lastDay);
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}`;
    }

    function categoryForServiceType(type) {
      const lower = String(type || '').toLowerCase();
      if (lower.includes('torque') || lower.includes('wheel off')) return 'inspection';
      if (lower.includes('schedule review')) return 'inspection';
      if (lower.includes('hire check')) return 'inspection';
      if (lower.includes('repair')) return 'repair';
      if (lower.includes('inspection')) return 'inspection';
      if (lower.includes('parts')) return 'parts';
      return 'service';
    }

    function compactAssetMeta(asset) {
      return [asset.machineType, asset.serialNumber ? `Serial ${asset.serialNumber}` : '', asset.site ? `Location ${asset.site}` : ''].filter(Boolean).join(' | ') || 'Details not set';
    }

    function nextDueText(asset) {
      const bits = [];
      const dateInfo = serviceDueDateInfo(asset);
      if (dateInfo.date) {
        const basis = dateInfo.basis === '12_month_service_rule' ? '12 months' : 'date';
        bits.push(`${formatDate(dateInfo.date)} (${basis})`);
      }
      if (asset.nextServiceDueHours) {
        const remaining = asset.lastKnownHours ? Number(asset.nextServiceDueHours) - Number(asset.lastKnownHours) : null;
        const remainingText = Number.isFinite(remaining) ? `, ${remaining} left` : '';
        bits.push(`${asset.nextServiceDueHours} hours${remainingText}`);
      }
      if (asset.nextServiceDueMileage) {
        const remaining = asset.lastKnownMileage ? Number(asset.nextServiceDueMileage) - Number(asset.lastKnownMileage) : null;
        const remainingText = Number.isFinite(remaining) ? `, ${remaining} miles left` : '';
        bits.push(`${asset.nextServiceDueMileage} miles${remainingText}`);
      }
      if (!bits.length) return '-';
      return `Whichever comes first: ${bits.join(' / ')}`;
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(`${value}T00:00:00`);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(String(value).replace(' ', 'T'));
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' });
    }

    function formatMoney(value) {
      if (value === null || value === undefined || value === '') return '';
      const num = Number(value);
      if (!Number.isFinite(num)) return '';
      return new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(num);
    }

    function titleCase(value) {
      return String(value || '').replace(/\b\w/g, char => char.toUpperCase());
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    let toastTimer = null;
    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2800);
    }
  </script>
</body>
