name = "pmg-driver-sync"
main = "index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["*/5 * * * *", "*/30 5-18 * * 1-6", "*/30 6-8 * * *"]

[[kv_namespaces]]
binding = "PMG_DATA"
id = "8620f47859fb4bf1b874754ed4d9b631"

[[services]]
binding = "CONCRETE_PRICE_SERVICE"
service = "pmg-concrete-price"

# SQLite is required: no KV read/merge/write fallback is safe for shared rows.
[[durable_objects.bindings]]
name = "PMG_APP_STORE"
class_name = "PmgAppStore"

[[migrations]]
tag = "v1-transactional-app-store"
new_sqlite_classes = ["PmgAppStore"]
